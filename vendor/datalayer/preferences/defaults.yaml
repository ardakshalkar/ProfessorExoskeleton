# The system layer: what every professor skill does when nobody has said
# otherwise. Shipped with DataLayer and committed.
#
# Five layers resolve on top of this, each beating the one before it:
#
#   1. this file                                          system
#   2. profiles/<institution>.yaml                        institution (a shipped
#      pack, named by `institution:` in any layer below)
#   3. $PROFESSOR_HOME/preferences.yaml                   professor
#   4. courses/<COURSE_ID>/preferences.yaml               course
#   5. courses/<COURSE_ID>/versions/<TERM>/preferences.yaml   run
#   6. flags on the invoking command                      task
#
# ainar-node/src/profile.ts is the one reader. Lists of {id: …} objects merge by
# id across layers; the keys under `locale`, `grading` (final_matchers,
# period_boundary, presets) and `marking` are institution/professor settings, not
# skill behaviour, and are neutral here.
#
# A value of `ask` is deliberately not defaulted: guessing it saves a question
# and costs a rebuild. See docs/settings.md.

version: 1
profile_id: professor-datalayer-defaults
scope: system

values:
  # Names a pack in profiles/. Empty: the workspace has not chosen one.
  institution: ""

  language:
    default: English

  locale:
    # Stamps on records and a new run's `timezone`. Neutral until an institution
    # or the professor says where they teach.
    timezone: UTC

  marking:
    defence:
      # A defence criterion marked "partly" keeps this share of the written mark.
      partial_factor: 0.5

  assessment:
    avoid_trick_questions: true
    require_answer_key: true
    require_validation: true
    # A machine suggestion is a suggestion until a person says otherwise.
    require_professor_approval: true

  grading:
    # Below this, the suggestion is surfaced for review rather than queued as
    # routine. It does not lower the approval requirement — nothing does.
    review_below_confidence: 0.8
    surface_disagreement: true
    # Regex sources; an assessment whose id or title matches one is the final.
    final_matchers:
      - '\bfinal\b'
    # first_midterm: the first period closes with the first midterm; else midpoint.
    period_boundary: midpoint   # midpoint | first_midterm
    # The structures a professor can divide a grade by. Institution packs add theirs.
    presets:
      - id: categories
        title: Homework · Quizzes · Midterms · Final
        family: category
        summary: "By kind of work, the usual split outside a ВСК system: each block holds every assessment of its kind across the term. Canvas assignment groups usually look like this."
        points: 100
        components:
          - component_id: HW
            title: Homework
            weight: 0.3
            parent: null
            points: null
            takes:
              types:
                - assignment
                - presentation
                - participation
                - other
                - project
          - component_id: QUIZ
            title: Quizzes
            weight: 0.1
            parent: null
            points: null
            takes:
              types:
                - quiz
                - oral_defense
          - component_id: MIDTERMS
            title: Midterms
            weight: 0.2
            parent: null
            points: null
            takes:
              types:
                - exam
          - component_id: FINAL
            title: Final
            weight: 0.4
            parent: null
            points: null
            takes:
              final: true
      - id: flat
        title: No blocks
        family: flat
        summary: Every assessment counts on its own, by its weight. The grade is the sum; nothing is grouped and no block has its own scale.
        points: null
        components: []
    

  presentation:
    # There is no sensible default for these two: a deck built for the wrong
    # audience is not a deck with one wrong slide, it is the wrong deck.
    audience: ask
    duration_minutes: ask

    style: lecture              # lecture | seminar | workshop
    density: moderate           # sparse | moderate | dense
    include_learning_objectives: true
    include_checks_for_understanding: true
    # Roughly one slide per four minutes of a taught session. A ceiling, not a
    # target.
    slides_per_10_minutes: 2.5

  outline:
    # An outline that is only a list of slides is a list of topics. The arc is
    # what makes the sequence mean something.
    require_arc: true
    # Cover every concept the module claims, or say which one is being left out
    # and why. Never silently.
    require_coverage_statement: true

  figures:
    source_format: svg          # what is committed; PNG is a render of it
    max_per_deck: 6
    require_alt_text: true
    # Colour is never the only channel: a red/green distinction is invisible to
    # part of every cohort and to every projector with a tired lamp.
    colour_only_encoding: forbidden

  render:
    target: pptx
    also_pdf: true
    output_directory: output

  publishing:
    # Nothing about an identified student leaves the machine without the
    # professor saying so, in the moment, for that thing.
    require_explicit_instruction: true
    student_facing_defaults_to_public_only: true
