assessment_id: ASSESSMENT-05
course_version_id: CSS-4008-2026-FALL
title: Final AI Project
type: project
description: >-
  Choose a problem, design an AI solution, evaluate it honestly and defend it
  orally.
module_id: MODULE-09
maximum_score: 100
weight: 0.50
opens_at: 2026-10-27T09:00:00+05:00
due_at: 2026-12-15T23:59:00+05:00
outcomes: [LO-01, LO-02, LO-03, LO-04]
submission_type: [pdf, code_repo, oral_defense]
# The channel, as against the formats above: the code arrives as a pushed
# repository. Nothing consumes a repository yet, so this is descriptive for now.
delivery: github_repo
settings:
  anonymous_grading: false
  allow_late_submission: false
  team_size_max: 3
  ai_review:
    enabled: true
    require_professor_approval: true
rubric:
  rubric_id: RUBRIC-05
  title: Final project rubric
  criteria:
    - criterion_id: CRIT-05-01
      rubric_id: RUBRIC-05
      title: Problem formulation
      maximum_score: 20
      outcome_id: LO-01
      concepts: [CONCEPT-AI-PROBLEM-TYPES]
      levels:
        - score: 20
          description: Problem is stated precisely and the AI framing is justified.
        - score: 10
          description: Problem stated, framing assumed rather than argued.
        - score: 3
          description: Problem statement is vague.

    - criterion_id: CRIT-05-02
      rubric_id: RUBRIC-05
      title: Data handling
      maximum_score: 20
      outcome_id: LO-03
      capability_id: CAP-DATA-REASONING
      concepts: [CONCEPT-DATA-PREPARATION, CONCEPT-TRAIN-TEST-SPLIT]
      levels:
        - score: 20
          description: Data provenance, limits and splits are all addressed.
        - score: 10
          description: Data prepared correctly, limits not discussed.
        - score: 3
          description: Data handling is undocumented.

    - criterion_id: CRIT-05-03
      rubric_id: RUBRIC-05
      title: Implementation and evaluation
      maximum_score: 35
      outcome_id: LO-02
      concepts: [CONCEPT-SUPERVISED-LEARNING, CONCEPT-MODEL-EVALUATION]
      levels:
        - score: 35
          description: Working solution with a baseline and an honest comparison.
        - score: 20
          description: Working solution, comparison weak or missing a baseline.
        - score: 5
          description: Solution does not run or is not evaluated.

    - criterion_id: CRIT-05-04
      rubric_id: RUBRIC-05
      title: Design justification and oral defence
      maximum_score: 25
      outcome_id: LO-04
      capability_id: CAP-AI-EXPERIMENT
      concepts: [CONCEPT-EXPERIMENT-DESIGN]
      levels:
        - score: 25
          description: Choices defended under questioning, limits acknowledged.
        - score: 15
          description: Choices explained, defence uneven under questioning.
        - score: 5
          description: Cannot account for the design decisions made.
