<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="fig-title fig-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="fig-title">Training, validation and test data, and what each one is allowed to decide</title>
  <desc id="fig-desc">One dataset divided into three parts. Training data, sixty per cent, fits the model's parameters. Validation data, twenty per cent, chooses between models and settings. Test data, twenty per cent, is drawn sealed and hatched: it is opened once, to report the number, and any decision made by looking at it turns it into training data.</desc>

  <defs>
    <pattern id="sealed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a5f7a" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <marker id="tick" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="4" cy="4" r="2.4" fill="#4a5f7a"/>
    </marker>
  </defs>

  <text x="60" y="38" font-size="19" font-weight="600" fill="#1f2933">One dataset, three jobs</text>
  <text x="60" y="60" font-size="14" fill="#52616b">CONCEPT-TRAIN-TEST-SPLIT</text>

  <!-- the bar -->
  <g stroke="#4a5f7a">
    <rect x="60" y="86" width="408" height="72" fill="#dbe4f0" stroke-width="1.5"/>
    <rect x="468" y="86" width="136" height="72" fill="#b9cbe2" stroke-width="1.5"/>
    <rect x="604" y="86" width="136" height="72" fill="url(#sealed)" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <g font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">
    <text x="264" y="118">Training</text>
    <text x="536" y="118">Validation</text>
    <text x="672" y="118">Test</text>
  </g>
  <g font-size="13" fill="#52616b" text-anchor="middle">
    <text x="264" y="139">60%</text>
    <text x="536" y="139">20%</text>
    <text x="672" y="139">20% · sealed</text>
  </g>

  <!-- what each part is allowed to decide -->
  <g stroke="#4a5f7a" stroke-width="1.4" marker-end="url(#tick)">
    <line x1="264" y1="158" x2="264" y2="190"/>
    <line x1="536" y1="158" x2="536" y2="190"/>
    <line x1="672" y1="158" x2="672" y2="190"/>
  </g>

  <g font-size="13.5" fill="#1f2933" text-anchor="middle">
    <text x="264" y="219">fits the parameters</text>
    <text x="264" y="237" font-size="12.5" fill="#52616b">seen many times</text>

    <text x="536" y="219">chooses the model</text>
    <text x="536" y="237" font-size="12.5" fill="#52616b">once per candidate</text>

    <text x="672" y="219">reports the number</text>
    <text x="672" y="237" font-size="12.5" fill="#52616b">once, at the end</text>
  </g>

  <line x1="60" y1="266" x2="740" y2="266" stroke="#c6ced6" stroke-width="1"/>
  <text x="60" y="292" font-size="14.5" fill="#1f2933">Any decision you make by looking at the test set makes it training data —</text>
  <text x="60" y="312" font-size="14.5" fill="#1f2933">including the decision to try again.</text>
</svg>
