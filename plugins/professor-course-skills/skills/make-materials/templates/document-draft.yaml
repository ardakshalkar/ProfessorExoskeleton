# The records that register whatever was written. The documents go in
# courses/<COURSE>/documents/generated.yaml and the resource in
# courses/<COURSE>/resources/generated.yaml. The material itself is already in
# its own folder, courses/<COURSE>/materials/{{ material }}/, the deck on top and
# its figures under `figures/`, and nothing moves it afterwards. The identifiers
# are the final ones; `approval: draft` on each record is what says the
# professor has not accepted it yet, and only they change that word.
#
# Never write `size_bytes` or `checksum` — both are computed from the file, and
# a hand-written sha256 is worse than an absent one.

documents:
  - document_id: DOC-{{ nnnn }}
    approval: draft   # always; never write approved
    title: "{{ material title }}"
    storage_key: courses/{{ COURSE }}/materials/{{ material }}/{{ filename }}
    mime_type: text/markdown
    course_run_id: "{{ COURSE_VERSION_ID }}"
    module_id: "{{ MODULE-ID }}"
    concepts: ["{{ CONCEPT-ID }}"]
    generated_by:
      produced_by: make-materials-skill
      model_id: "{{ the model that wrote it }}"
      workflow_version: claude-code/prototype
      prompt_version: make-materials/v1
      input_refs: ["{{ MODULE-ID }}", "{{ LO-ID }}"]
      created_at: "{{ YYYY-MM-DDTHH:MM:SS+05:00 }}"
    # Slides only. The plan is a contract with the renderer: slide count, order
    # and titles must match the markdown or it stops.
    presentation_plan:
      audience: "{{ who is in the room }}"
      style: "{{ lecture / seminar / lab }}"
      duration_minutes: {{ from the scheduled activity }}
      max_slides: {{ n }}
      outcomes: ["{{ LO-ID }}"]
      concepts: ["{{ CONCEPT-ID }}"]
      slides:
        - number: 1
          type: "{{ hook / concept / example / check }}"
          title: "{{ slide title, matching the markdown }}"
          minutes: {{ n }}
          purpose: "{{ what this slide is for }}"
          concepts: ["{{ CONCEPT-ID }}"]

  # Every figure is its own Document, with no Resource of its own, marked
  # `approval: draft` like the deck. An unregistered figure is a file
  # `ainar validate` never checks and the record knows nothing about.
  - document_id: DOC-{{ nnnn }}
    approval: draft
    title: "{{ what the figure shows }}"
    storage_key: courses/{{ COURSE }}/materials/{{ material }}/figures/{{ figure filename }}
    mime_type: image/svg+xml
    course_run_id: "{{ COURSE_VERSION_ID }}"
    module_id: "{{ MODULE-ID }}"
    concepts: ["{{ CONCEPT-ID }}"]
    generated_by:
      produced_by: make-materials-skill
      model_id: "{{ the model that wrote it }}"
      workflow_version: claude-code/prototype
      prompt_version: make-materials/v1
      input_refs: ["{{ MODULE-ID }}"]
      created_at: "{{ YYYY-MM-DDTHH:MM:SS+05:00 }}"

resources:
  - resource_id: RES-{{ nnnn }}
    approval: draft
    title: "{{ material title }}"
    kind: "{{ slides / handout / notebook }}"
    course_run_id: "{{ COURSE_VERSION_ID }}"
    document_id: DOC-{{ nnnn }}
    concepts: ["{{ CONCEPT-ID }}"]
    required: {{ true / false }}
    # If this replaces an earlier version, name it rather than overwriting:
    # supersedes: DOC-{{ nnnn }}
