      '      {% for m in w.meetings %}<button class="chip meet" data-pick="meeting" data-id="{{ m.id }}"><span class="k mono">{{ m.on }}</span><svg class="i" aria-hidden="true"><use href="#i-{{ m.icon }}"/></svg>{{ m.label }}</button>{% if m.misdated %}<button class="chip gap {{ w.tier }}" data-pick="gap" data-id="misdated" data-ref="{{ m.id }}" title="{{ m.misdated }}"><svg class="i" aria-hidden="true"><use href="#i-misdated"/></svg>Check date</button>{% endif %}{% endfor %}',
      '      {% for d in w.decks %}<button class="chip {{ d.tone }}" data-pick="deck" data-id="{{ d.id }}"><svg class="i" aria-hidden="true"><use href="#i-slides"/></svg>{{ d.label }}</button>{% endfor %}',
      '    </div>{% endif %}',
      '    {% if w.work %}<div class="row">',
      '      {% for a in w.work %}<button class="chip {{ a.tone }}" data-pick="work" data-id="{{ a.id }}"><span class="k mono">{{ a.when }}</span><svg class="i" aria-hidden="true"><use href="#i-{{ a.icon }}"/></svg>{{ a.title }}</button>{% endfor %}',
      '    </div>{% endif %}',
      '    {% if w.gaps %}<div class="row">',
      '      {% for g in w.gaps %}<button class="chip gap {{ g.tier }}" data-pick="gap" data-id="{{ g.kind }}" title="{{ g.note }}"><svg class="i" aria-hidden="true"><use href="#i-{{ g.icon }}"/></svg>{{ g.label }}</button>{% endfor %}',
      '    </div>{% endif %}',
      '    {% if w.concepts %}<div class="row">',
      '      {% for c in w.concepts %}<span class="chip concept">{{ c }}</span>{% endfor %}',
      '    </div>{% endif %}',
      '  </div>',
      '</div>',
    ].join('\n'),
  },
  compact: {
    name: 'One line',
    suits: 'sixteen weeks on one screen — title and state, nothing else',
    tmpl: [
      '<div class="wk {{ w.classes }}" data-pick="week" data-id="{{ w.week }}" data-week="{{ w.week }}" role="button" tabindex="0" aria-label="Week {{ w.week }}{% if w.title %}: {{ w.title }}{% endif %}">',
      '  <div class="wk-n"><b>{{ w.label }}</b></div>',
      '  <div class="wk-body"><div class="wk-head">',
      '    {% if w.title %}<h3>{{ w.title }}</h3>{% else %}<h3 class="none">Unplanned</h3>{% endif %}',
      '    <span class="k mono">{{ w.mark }}</span>',
      '    {% for g in w.gaps %}<button class="chip gap {{ g.tier }}" data-pick="gap" data-id="{{ g.kind }}" title="{{ g.note }}"><svg class="i" aria-hidden="true"><use href="#i-{{ g.icon }}"/></svg>{{ g.label }}</button>{% endfor %}',
      '    {% if w.ready %}<span class="ready">ready</span>{% endif %}',
      '  </div></div>',
      '</div>',
    ].join('\n'),
  },
  teaching: {
    name: 'Teaching first',
    suits: 'what is taught and what is handed in; materials fold away',
    tmpl: [
      '<div class="wk {{ w.classes }}" data-pick="week" data-id="{{ w.week }}" data-week="{{ w.week }}" role="button" tabindex="0" aria-label="Week {{ w.week }}{% if w.title %}: {{ w.title }}{% endif %}">',
      '  <div class="wk-n"><b>{{ w.label }}</b><span>{{ w.mark }}</span></div>',
      '  <div class="wk-body">',
      '    <div class="wk-head">',
      '      {% if w.title %}<h3>{{ w.title }}</h3>{% else %}<h3 class="none">Unplanned</h3>{% endif %}',
      '      {% if w.is_now %}<span class="pill now">this week</span>{% endif %}',
      '    </div>',
      '    {% if w.concepts %}<div class="row">{% for c in w.concepts %}<span class="chip concept">{{ c }}</span>{% endfor %}</div>{% endif %}',
      '    {% if w.work %}<div class="row">{% for a in w.work %}<button class="chip {{ a.tone }}" data-pick="work" data-id="{{ a.id }}"><span class="k mono">{{ a.when }}</span><svg class="i" aria-hidden="true"><use href="#i-{{ a.icon }}"/></svg>{{ a.title }}</button>{% endfor %}</div>{% endif %}',
      '    {% if w.gaps %}<div class="row">{% for g in w.gaps %}<button class="chip gap {{ g.tier }}" data-pick="gap" data-id="{{ g.kind }}" title="{{ g.note }}"><svg class="i" aria-hidden="true"><use href="#i-{{ g.icon }}"/></svg>{{ g.label }}</button>{% endfor %}</div>{% endif %}',
      '  </div>',
      '</div>',
    ].join('\n'),
  },
};

// ---------------------------------------------------------------------------
// APPEARANCE — the other half. Variables only, and checked for markup the way
// `templates.ts` checks a style sheet: a `<` in one is refused rather than
// escaped, because the text is embedded inside a <style> element.
// ---------------------------------------------------------------------------
const APPEARANCE = {
  // Sizes from the five-step scale only, and Dense stops at its 12px floor.
  plain:     { name: 'Plain',     css: '--card-pad:12px; --card-gap:8px; --title:14px; --chip:13px;' },
  dense:     { name: 'Dense',     css: '--card-pad:7px; --card-gap:5px; --title:13px; --chip:12px;' },
  projector: { name: 'Projector', css: '--card-pad:18px; --card-gap:12px; --title:20px; --chip:16px;' },
};
const MARKUP = /[<>]|@import|url\s*\(/i;

// Three sections, and the outline's five ways of being read. The split is the
// professor's own question rather than the model's shape: what is the course,
// how is the class doing, and what is waiting for me.
// Planning and Teaching come first: they are the two modes a professor is in.
// Planning is the term as a structure — topics, quizzes, homework, weights —
// and asks whether it holds together. Teaching is one week between the one
// before and the one after, and asks what to do now. The outline below them
// is the full detail either mode can drop into.
const SECTIONS = [
  { id: 'planning', label: 'Planning', hint: 'does the term hold together', icon: 'calendar' },
  { id: 'teaching', label: 'Teaching', hint: 'this week, between the last and the next', icon: 'lecture' },
  { id: 'outline', label: 'Course outline', hint: 'every week in full', icon: 'outline' },
  { id: 'students', label: "Students' progress", hint: 'how the class is doing', icon: 'seminar' },
  { id: 'todos', label: 'Todos', hint: 'what is waiting for you', icon: 'inbox' },
];
const OUTLINE_VIEWS = [
  { id: 'student', label: 'Student view', hint: 'the record only — what a student may be shown' },
  { id: 'prof', label: 'Professor view', hint: 'with drafts and with what is missing' },
  { id: 'lectures', label: 'Lectures', hint: 'every meeting of the term, and what it uses' },
  { id: 'assessment', label: 'Assessment', hint: 'graded work, its weight and its rubric' },
  { id: 'quiz', label: 'Quiz', hint: 'the quizzes alone, with their items' },
];
// What the outline is read by. The week is the spine; the others are the same
// records read down a different axis.
const GROUPS = [['week', 'Week'], ['lectures', 'Meeting'], ['assessment', 'Graded work'],
                ['quiz', 'Quizzes']];
/** Which halves of a week the two table views ask for. */
const OUTLINE_MODE = {
  student: { gaps: false, drafts: false },
  prof: { gaps: true, drafts: true },
};
// What pressing a hole does, not what the hole is. The tally in the strip still
// counts the hole; the chip on the week is the way to fill it.
const GAP_WORD = { module: 'Plan module', deck: 'Draft deck', deadline: 'Set dates',
                   weight: 'Set weight', brief: 'Write brief', misdated: 'Check date' };

// Icons, by what the record says a thing is. Names in the sprite at the top of
// the page; a kind with no entry gets the plain file, never nothing.
const GAP_ICON = { module: 'module', deck: 'slides', deadline: 'calendar', weight: 'weight',
                   brief: 'brief', misdated: 'misdated' };
const MEETING_ICON = { lecture: 'lecture', lab: 'lab', seminar: 'seminar', discussion: 'seminar',
                       review: 'seminar', exercise: 'homework', project_work: 'project',
                       field_work: 'project', reading: 'reading' };
const RESOURCE_ICON = { slides: 'slides', reading: 'reading', textbook_chapter: 'reading',
                        dataset: 'data', notebook: 'notebook', video: 'video', link: 'link',
                        tool: 'notebook' };
const WORK_ICON = { quiz: 'quiz', assignment: 'homework', project: 'project', exam: 'exam',
                    presentation: 'lecture', oral_defense: 'seminar', participation: 'seminar' };
const TODO_ICON = { action: 'action', approve: 'approve', signal: 'signal', missing: 'missing' };
// A structural todo takes the icon of the hole it counts.
function todoIcon(t) { return t.kind === 'gap' ? (GAP_ICON[t.id] || 'module') : (TODO_ICON[t.kind] || 'action'); }
function iconOf(table, key, fallback) { return table[key] || fallback || 'file'; }
/** The same icon as markup, for the band and the lead card built outside a template. */
function svgIcon(name) {
  return '<svg class="i" aria-hidden="true"><use href="#i-' + esc(name) + '"/></svg>';
}

/** An icon as a React element, for the chrome outside the templates. */
function icon(name, cls) {
  return h('svg', { className: 'i' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true', focusable: 'false' },
    h('use', { href: '#i-' + name }));
}

// The three enums the columns are cut along, from `src/model/common.ts`. A week
// is sorted into them rather than into categories invented for the table, so a
// course using `field_work` or `oral_defense` lands somewhere real instead of
// disappearing.
//
// ActivityType  lecture · lab · seminar · discussion · reading · exercise ·
//               project_work · field_work · review · other
// ResourceKind  slides · reading · dataset · notebook · video · link ·
//               textbook_chapter · tool · other
// AssessmentType assignment · quiz · exam · project · presentation ·
//               oral_defense · participation · other
const READING_WORD = { textbook_chapter: 'chapter', reading: 'reading', video: 'video',
                       link: 'link', dataset: 'data', notebook: 'notebook', tool: 'tool',
                       other: 'file' };
const TYPE_WORD = { quiz: 'quiz', assignment: 'homework', project: 'project', exam: 'exam',
                    presentation: 'talk', oral_defense: 'defence', participation: 'participation',
                    other: 'work' };
const OUTCOME_TITLE = (DATA.outcomes || []).reduce(function (all, o) {
  all[o.outcome_id] = o.title; return all;
}, {});
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// When a hole bites, from where the run stands. This week and next are the
// ones a professor can still fix before the class meets; anything already
// taught is a note for next year. Said once here so the chip, the band and the
// tally cannot disagree about which is which.
function tierOf(weekNumber) {
  const now = DATA.current_week;
  if (now == null) return 'later';
  if (weekNumber < now) return 'past';
  return weekNumber <= now + 1 ? 'soon' : 'later';
}

// A hole a draft already stands in for is not a hole while drafts are shown:
// week 10 with a proposed module should offer that draft, not "Plan module".
function openGaps(week, mode) {
  // `misdated` is on the payload since outline.ts learned it, but this page
  // draws it beside its meeting from `DATA.misdated`; counted once, there.
  const gaps = week.gaps.filter(function (g) { return g.kind !== 'misdated'; });
  if (!mode.drafts) return gaps;
  return gaps.filter(function (g) {
    if (g.kind === 'module') return !DATA.proposed.modules[week.week];
    if (g.kind === 'deck') return !DATA.proposed.decks[week.week];
    return true;
  });
}

// A meeting whose date falls outside the week it is drawn in (`build.mjs`
// finds these). Said on the chip's title; empty where gaps are not shown.
function misdatedNote(activityId, mode) {
  if (!mode.gaps) return '';
  const m = (DATA.misdated || []).filter(function (x) { return x.activity_id === activityId; })[0];
  if (!m) return '';
  return 'Dated ' + shortDate(m.on) + ', which is week ' + (m.date_week || '—') +
    ' — but its module puts it in week ' + m.week + '.';
}

/**
 * Every open hole on the page, with its tier: the week gaps the chips draw,
 * the meetings dated off their week, and the work in the card before week 1.
 * Counted from the same functions that draw them, so the tally and the page
 * cannot disagree.
 */
function rankedGaps() {
  const prof = OUTLINE_MODE.prof;
  const out = { soon: 0, later: 0, past: 0 };
  DATA.weeks.forEach(function (w) {
    openGaps(w, prof).forEach(function () { out[tierOf(w.week)] += 1; });
  });
  (DATA.misdated || []).forEach(function (m) { out[tierOf(m.week)] += 1; });
  undatedWork(prof).forEach(function (x) { out[x.week ? tierOf(x.week) : 'soon'] += 1; });
  return out;
}

function shortDate(value) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || ''));
  return m ? MONTHS[Number(m[2]) - 1] + ' ' + Number(m[3]) : '';
}
function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

// ---------------------------------------------------------------------------
// The view-model: what each value SAYS. The structure decides where it goes.
// This is the same split `course-outline.js` and `course-outline.tmpl` have,
// and it is what keeps a professor's own structure from being able to compute.
// ---------------------------------------------------------------------------
function weekModel(week, mode, selected) {
  const proposedModule = mode.drafts ? DATA.proposed.modules[week.week] : null;
  const proposedDeck = mode.drafts ? DATA.proposed.decks[week.week] : null;
  const proposedWork = mode.drafts ? DATA.proposed.assessments[week.week] : null;
  const title = week.modules.map(function (m) { return m.title; }).join(' · ');

  const decks = [];
  week.meetings.forEach(function (m) {
    (m.resources || []).forEach(function (r) {
      if (r.kind === 'slides') decks.push({ id: r.resource_id, label: 'Slides', tone: 'deck' });
    });
  });
  if (proposedDeck) decks.push({ id: proposedDeck.resource_id, label: 'Slides · proposed', tone: 'draftc' });

  const work = [];
  week.due.forEach(function (a) {
    work.push({ id: a.assessment_id, title: a.title, when: 'due ' + shortDate(a.due_on), tone: 'work', icon: iconOf(WORK_ICON, a.type) });
  });
  week.opens.forEach(function (a) {
    work.push({ id: a.assessment_id, title: a.title, when: 'opens ' + shortDate(a.opens_on), tone: 'work', icon: iconOf(WORK_ICON, a.type) });
  });
  // Work with no date is on no week, whatever week the record files it under.
  // Where gaps are shown it goes to the card before week 1 (`undatedWork`); the
  // student view has no such card, so there it stays where the record put it.
  if (!mode.gaps) week.undated.forEach(function (a) {
    work.push({ id: a.assessment_id, title: a.title, when: 'no date', tone: 'gap', icon: iconOf(WORK_ICON, a.type) });
  });
  if (proposedWork && proposedWork.due_on) {
    work.push({ id: proposedWork.assessment_id, title: proposedWork.title + ' · proposed',
                when: 'due ' + shortDate(proposedWork.due_on), tone: 'draftc',
                icon: iconOf(WORK_ICON, proposedWork.type) });
  }

  // The three columns of the term table. The class is one column whatever type
  // of meeting it was, because a week whose only session is a lab should not
  // read as a week with no class; a resource is the deck or it is something to
  // read, and either way it belongs to the meeting that set it; and graded work
  // is the quiz or it is everything else the `AssessmentType` enum holds.
  // Nothing falls between them, which is what a closed enum is for.
  // The class, with what it uses inside it. A deck and a reading are the
  // meeting's own `resources` in the record, so nesting them under the meeting
  // is the shape the model already has rather than a flattening of it — and it
  // answers "what am I teaching on Tuesday, and with what" in one cell.
  const lecture = week.meetings.map(function (m) {
    const materials = [];
    (m.resources || []).forEach(function (r) {
      const deck = r.kind === 'slides';
      // The formats this document also exists in. A deck is registered twice —
      // the .pptx and the .pdf rendered from it — and only the .pptx has a
      // resource pointing at it, so without this the PDF beside every lecture
      // deck appeared nowhere on the page. One chip per format, the deck's own
      // first, which is what the pane draws.
      const formats = (DATA.materials[r.document_id] || {}).formats || [];
      formats.slice(1).forEach(function (f) {
        materials.push({ id: r.resource_id + ':' + f.doc, doc: f.doc, label: f.label,
                         kind: '', tone: 'fmt', pick: 'resource', icon: '' });
      });
      materials.push({
        id: r.resource_id,
        // The document is what `/file` serves; the resource is what the week
        // names. A chip needs both — one to open, one to put in the packet.
        doc: r.document_id || '',
        label: deck ? 'Slides' : r.title,
        // The deck's chip says Slides and is tinted as the deck; a kind label
        // beside it would read "deck Slides". Every other kind needs the word,
        // because "Student performance dataset" does not say it is a dataset.
        kind: deck ? '' : (READING_WORD[r.kind] || r.kind),
        tone: deck ? 'deck' : '',
        pick: deck ? 'deck' : 'resource',
        icon: deck ? 'slides' : iconOf(RESOURCE_ICON, r.kind),
      });
    });
    // Slides first, then its other formats, then everything else: the deck is
    // the one a professor opens minutes before the class.
    const rank = function (x) { return x.tone === 'deck' ? 0 : x.tone === 'fmt' ? 1 : 2; };
    materials.sort(function (a, b) { return rank(a) - rank(b); });
    return { id: m.activity_id, on: shortDate(m.on),
             label: m.type + (m.location ? ' · ' + m.location : ''),
             icon: iconOf(MEETING_ICON, m.type, 'lecture'),
             materials: materials, misdated: misdatedNote(m.activity_id, mode) };
  });

  // Graded work, split the way the professor asked for it: the quiz has a
  // column of its own because it is the recurring one, and everything else the
  // `AssessmentType` enum holds — assignment, project, exam, presentation,
  // defence, participation — shares the other.
  const assessment = [], quiz = [];
  work.forEach(function (a) {
    const source = week.due.concat(week.opens, week.undated).filter(function (x) {
      return x.assessment_id === a.id;
    })[0];
    const brief = DATA.briefs[a.id] || {};
    (source && source.type === 'quiz' ? quiz : assessment).push(
      Object.assign({}, a, {
        kind: TYPE_WORD[(source && source.type) || 'other'] || (source && source.type) || 'work',
        weight: source && source.weight != null ? Math.round(source.weight * 100) + '%' : '',
        // The brief students read, as the chip's own press. Empty when there is
        // none, and the week then draws `no brief` beside the work in the same
        // amber a missing weight gets — the pane's own rule, because graded
        // work a student cannot start is a hole worth seeing.
        brief: brief.none ? '' : a.id,
        no_brief: Boolean(brief.none),
      }));
  });

  // One column of graded work, the type said on the chip. A Quiz column of its
  // own held one item in sixteen weeks on this course; a tag holds it in one word.
  const graded = [];
  work.forEach(function (a) {
    const chip = assessment.concat(quiz).filter(function (x) { return x.id === a.id && x.when === a.when; })[0];
    if (chip) graded.push(chip);
  });

  // The outcomes the week serves, and how: TAUGHT by its module, ASSESSED by
  // work falling due in it. The width the Quiz column gave back goes here,
  // because it is the column that makes alignment visible week by week — an
  // outcome assessed in a week that never taught it is the thing to see.
  const taught = {};
  week.modules.forEach(function (m) { (m.outcomes || []).forEach(function (o) { taught[o.id] = o.title; }); });
  const assessed = {};
  week.due.forEach(function (a) { (a.outcomes || []).forEach(function (id) { assessed[id] = true; }); });
  const weekOutcomes = Object.keys(Object.assign({}, taught, assessed)).sort().map(function (id) {
    const how = taught[id] !== undefined && assessed[id] ? 'taught · assessed'
      : assessed[id] ? 'assessed' : 'taught';
    return { id: id, title: taught[id] || OUTCOME_TITLE[id] || id, how: how,
             tone: assessed[id] ? 'hit' : '' };
  });

  return {
    week: week.week,
    first: week.week === DATA.weeks[0].week,
    label: week.week < 10 ? '0' + week.week : String(week.week),
    mark: shortDate(week.starts_on),
    dates: shortDate(week.starts_on) + ' – ' + shortDate(week.ends_on),
    // The three columns are facts about the week in either view. What the
    // student view drops is not a column — it is the gaps and the drafts, which
    // are the professor's own working state and not the course.
    lecture: lecture,
    assessment: assessment,
    quiz: quiz,
    // The template language has no `not`, and an empty list is falsey, so the
    // em dash a column draws when it holds nothing is a value rather than a
    // condition. Same reason `course-outline.js` carries `weights_short`.
    no_lecture: !lecture.length,
    no_assessment: !assessment.length,
    no_quiz: !quiz.length,
    graded: graded,
    no_graded: !graded.length,
    outcomes: weekOutcomes,
    no_outcomes: !weekOutcomes.length,
    // Once per week, not once per meeting: the model's rule is that a week
    // which meets and registers no slides has one deck gap, and a lecture and
    // a lab both saying "no deck" would report it twice.
    // A gap, so only where gaps are shown: the student view is the record alone.
    no_deck: mode.gaps && !decks.length && week.meetings.length > 0,
    deck_note: (week.gaps.filter(function (g) { return g.kind === 'deck'; })[0] || {}).note || '',
    // Every gap except the one the Slides column already draws. A week that is
    // missing its deck says so once, in the column whose subject it is.
    gaps_other: mode.gaps
      ? openGaps(week, mode).filter(function (g) { return g.kind !== 'deck'; })
          .map(function (g) { return { kind: g.kind, label: GAP_WORD[g.kind], icon: GAP_ICON[g.kind], note: g.note, tier: tierOf(week.week) }; })
      : [],
    tier: tierOf(week.week),
    title: title || (proposedModule ? proposedModule.title : ''),
    proposed: Boolean(proposedModule && !title),
    is_now: week.week === DATA.current_week,
    ready: mode.gaps && week.gaps.length === 0,
    // Selection is a value on the model rather than a class the chrome reaches
    // in and adds, so a structure that renders the card differently still shows
    // what is selected without knowing that selection exists.
    classes: (week.week === DATA.current_week ? 'now ' : '') +
             (selected === week.week ? 'sel ' : '') +
             (mode.gaps && week.gaps.length === 0 ? 'quiet' : ''),
    meetings: week.meetings.map(function (m) {
      return { id: m.activity_id, on: shortDate(m.on),
               label: m.type + (m.location ? ' · ' + m.location : ''),
               icon: iconOf(MEETING_ICON, m.type, 'lecture'),
               misdated: misdatedNote(m.activity_id, mode) };
    }),
    decks: decks,
    work: work,
    gaps: mode.gaps
      ? openGaps(week, mode).map(function (g) { return { kind: g.kind, label: GAP_WORD[g.kind], icon: GAP_ICON[g.kind], note: g.note, tier: tierOf(week.week) }; })
      : [],
    // Every concept the week's module names, not the first four. On a card at
    // three hundred pixels that had to fold; on a full-width page the line of
    // concepts IS the week's claim about what it teaches, and a fold would hide
    // the half a professor is checking.
    concepts: week.modules.reduce(function (all, m) {
      return all.concat(m.concepts.map(function (c) { return c.title || c.id; }));
    }, []),
  };
}

// --------------------------------------------------------------- the packet
function packetFor(sel) {
  if (!sel) return null;
  const week = sel.week;
  if (sel.kind === 'student') {
    return { run: DATA.run.id, view: 'students', student_id: sel.id,
             concepts_without_evidence: sel.student.concepts.filter(function (c) {
               return c.proportion === null;
             }).length,
             signals: sel.student.signals.map(function (s) { return s.signal_id; }) };
  }
  if (sel.kind === 'todo') {
    return Object.assign({ run: DATA.run.id, view: 'todos', todo: sel.todo.kind },
      sel.todo.kind === 'gap' ? { gap: sel.todo.id, weeks: sel.todo.weeks }
        : { id: sel.todo.id });
  }
  if (!week) return { run: DATA.run.id, view: sel.view || 'outline' };
  const base = { run: DATA.run.id, view: 'outline', shown: sel.view, week: week.week };
  if (sel.kind === 'week') {
    return Object.assign(base, {
      module_id: (week.modules[0] || {}).module_id || null,
      planned: week.planned,
      gaps: week.gaps.map(function (g) { return g.kind; }),
    });
  }
  if (sel.kind === 'gap') {
    // A press on a band or on one piece of work names exactly what it is about:
    // the weeks the band folded, or the assessment beside the chip.
    if (sel.id === 'misdated') {
      const m = (DATA.misdated || []).filter(function (x) { return x.activity_id === sel.ref; })[0] || {};
      return Object.assign(base, { gap: 'misdated', activity_id: sel.ref, on: m.on, week_by_date: m.date_week });
    }
    if (sel.ref) return Object.assign(base, { gap: sel.id, assessment_id: sel.ref });
    if (sel.weeks) return Object.assign(base, { week: undefined, weeks: sel.weeks, gap: sel.id });
    const gap = week.gaps.filter(function (g) { return g.kind === sel.id; })[0] || {};
    return Object.assign(base, { gap: sel.id, ids: gap.ids || [] });
  }
  if (sel.kind === 'meeting') return Object.assign(base, { activity_id: sel.id });
  if (sel.kind === 'outcome') return Object.assign(base, { outcome_id: sel.id });
  if (sel.kind === 'work') return Object.assign(base, { assessment_id: sel.id });
  if (sel.kind === 'deck') return Object.assign(base, { resource_id: sel.id, kind: 'slides' });
  if (sel.kind === 'resource') return Object.assign(base, { resource_id: sel.id });
  return base;
}

function promptFor(sel) {
  if (!sel) return 'What needs me first on this course?';
  if (sel.kind === 'student') {
    return 'What is ' + sel.id + ' struggling with, and what does it depend on? ' +
      'Use recorded evidence only.';
  }
  if (sel.kind === 'todo') {
    if (sel.todo.kind === 'approve') return 'Show me the suggested grades for ' + sel.id +
      ' with their evidence, worst confidence first. Do not approve anything.';
    if (sel.todo.kind === 'signal') return 'Tell me what is behind ' + sel.id + ' before I act on it.';
    if (sel.todo.kind === 'gap') return sel.todo.title + ' — ' + sel.todo.detail +
      '. What should I do about it first?';
    return 'Take me through: ' + sel.todo.title;
  }
  if (!sel.week) return 'Tell me about ' + sel.id + '.';
  const w = sel.week.week;
  const title = (sel.week.modules[0] || {}).title || 'this week';
  if (sel.kind === 'gap') {
    if (sel.id === 'quiet' && sel.weeks) return 'Weeks ' + sel.weeks[0] + '–' +
      sel.weeks[sel.weeks.length - 1] + ' have no graded work opening, running or falling due. ' +
      'Should something be assessed there, given what those weeks teach? Propose it as a draft; ' +
      'change nothing else.';
    if (sel.id === 'weights') return 'The weights in ' + DATA.run.id + ' do not settle the grading ' +
      'policy: ' + (DATA.planning.note || 'see the grading section') + ' Propose a correction and wait.';
    if (sel.id === 'misdated') return sel.ref + ' — ' + misdatedNote(sel.ref, OUTLINE_MODE.prof) +
      ' Which is wrong: its date, its module’s week, or the run’s start date? Change nothing until I say.';
    if (sel.id === 'brief') return sel.ref + ' has no brief students can read. Draft one from its ' +
      'rubric and outcomes with /design-assessment, as a draft for me to read.';
    if (sel.id === 'deadline' && sel.ref) return 'Ask me the open and due dates for ' + sel.ref +
      ' before running anything — those dates exist only in my head.';
    if (sel.id === 'module' && sel.weeks) return 'Weeks ' + sel.weeks[0] + '–' +
      sel.weeks[sel.weeks.length - 1] + ' have no module. Propose what they should teach, given ' +
      'what comes before them and what falls due in them.';
    if (sel.id === 'deck') return 'Week ' + w + ' has no deck. Draft the slides for ' + title + ' with /make-materials.';
    if (sel.id === 'deadline') {
      const g = sel.week.gaps.filter(function (x) { return x.kind === 'deadline'; })[0] || { ids: [] };
      return 'Ask me the open and due dates for ' + g.ids.join(', ') +
        ' before running anything — those dates exist only in my head.';
    }
    if (sel.id === 'weight') return 'What should the unweighted work in week ' + w + ' be worth?';
    return 'Week ' + w + ' has no module. What should it teach, given the weeks either side?';
  }
  if (sel.kind === 'work') return 'Show me ' + sel.id + ' and how it is going.';
  if (sel.kind === 'outcome') return 'Which work measures ' + sel.id + ', and is what week ' + w +
    ' teaches enough to be assessed on it? Use /syllabus-review’s alignment rules.';
  if (sel.kind === 'meeting') return 'Prepare ' + sel.id + '.';
  if (sel.kind === 'deck') return 'What was read out of this deck?';
  if (sel.kind === 'resource') return 'Is ' + sel.id + ' still the right thing to set for week ' + w + '?';
  return 'For week ' + w + ', what should I teach and what should I revisit first?';
}

function replyFor(sel) {
  if (sel && sel.kind === 'student') {
    const gaps = sel.student.concepts.filter(function (c) { return c.proportion === null; });
    return ['Recorded evidence only, so this is narrower than it looks: ' +
            (sel.student.concepts.length - gaps.length) + ' of ' + sel.student.concepts.length +
            ' concepts have any at all.',
            gaps.length
              ? 'Nothing has been observed on ' + gaps.slice(0, 2).map(function (c) { return c.title; })
                .join(' or ') + ', which is an absence of evidence rather than a gap in what they know.'
              : 'Every concept has been observed at least once.',
            'I can draft a report for them, but nothing here is a judgement until you approve one.'];
  }
  if (sel && sel.kind === 'todo' && sel.todo.kind === 'approve') {
    return ['I can lay the suggestions out with the evidence each one cites and its confidence.',
            'I cannot decide them, and there is no route from this page that could: a grade is ' +
            'yours when you write your professor_decision beside the suggestion.'];
  }
  if (sel && sel.kind === 'gap' && sel.id === 'deck') {
    const concepts = ((sel.week.modules[0] || {}).concepts || [])
      .slice(0, 2).map(function (c) { return c.title; }).join(' and ');
    return ['I have the week, its module and what is missing from it, so there is nothing to look up first.',
            'MODULE-' + sel.week.week + ' introduces ' + (concepts || 'this week’s concepts') +
            '. Eighteen slides against those, registered in the course as a resource marked approval: draft.',
            'Students see none of it until you change that word in its record.'];
  }
  if (sel && sel.kind === 'gap' && sel.id === 'deadline') {
    return ['Skipping the usual validate-and-inbox opening on purpose: nothing on disk can answer this.',
            'Once you tell me, I will set opens_at and due_at on the record and confirm what I wrote.'];
  }
  return ['The turn opens with the packet above, so I am not spending three tool calls working out what you are looking at.',
          'Say the word and I will start.'];
}

// ------------------------------------------------------------------- spine

// A week with nothing planned in it: no module, no meeting, and no drafted
// module standing in for one. Graded work falling due in it does not make it
// planned — the final project due in week 16 is the reason to plan week 16.
function isEmptyWeek(week, mode) {
  return !week.modules.length && !week.meetings.length &&
    !(mode.drafts && DATA.proposed.modules[week.week]);
}

// Consecutive weeks, with every run of two or more empty ones folded into one
// band. A single empty week between two planned ones stays a row: it is a hole
// in the middle of the term, and a band would make it look like a tail.
function rowsOf(weeks, mode) {
  const rows = [];
  let run = [];
  const flush = function () {
    if (run.length >= 2) rows.push({ band: run });
    else run.forEach(function (w) { rows.push({ week: w }); });
    run = [];
  };
  weeks.forEach(function (w) {
    if (isEmptyWeek(w, mode)) run.push(w);
    else { flush(); rows.push({ week: w }); }
  });
  flush();
  return rows;
}

// Everything the professor has to put on a date: record work with none, the
// run's unplaced work, and a drafted assessment with no due date.
function undatedWork(mode) {
  if (!mode.gaps) return [];
  const out = [];
  DATA.weeks.forEach(function (w) {
    w.undated.forEach(function (a) {
      out.push({ id: a.assessment_id, title: a.title, week: w.week, tone: 'work' });
    });
    const p = mode.drafts ? DATA.proposed.assessments[w.week] : null;
    if (p && !p.due_on) out.push({ id: p.assessment_id, title: p.title + ' · proposed',
                                   week: w.week, tone: 'draftc' });
  });
  (DATA.unplaced.assessments || []).forEach(function (a) {
    out.push({ id: a.assessment_id, title: a.title, week: '', tone: 'work' });
  });
  return out;
}

const COLUMN_HEADS = '<div class="th">Lecture</div><div class="th">Graded work</div><div class="th">Outcomes</div>';

function bandMarkup(run, mode, layout, first) {
  const a = run[0], z = run[run.length - 1];
  const span = 'Weeks ' + a.week + '–' + z.week;
  const work = [];
  run.forEach(function (w) {
    const m = weekModel(w, mode, null);
    m.graded.forEach(function (x) {
      work.push('<button class="chip ' + esc(x.tone) + '" data-pick="work" data-id="' + esc(x.id) +
        '" data-week="' + esc(w.week) + '" data-brief="' + esc(x.brief) + '"><span class="k mono">' +
        esc(x.when) + '</span><span class="tag">' + svgIcon(x.icon) + esc(x.kind) + '</span>' + esc(x.title) + '<span class="wt">' + esc(x.weight) + '</span></button>');
    });
  });
  return (first && layout === 'grid3' ? COLUMN_HEADS : '') +
    '<div class="band" data-week="' + esc(a.week) + '">' +
    '<b>' + svgIcon('calendar') + ' ' + esc(span) + '</b><span class="k mono">' + esc(shortDate(a.starts_on) + ' – ' + shortDate(z.ends_on)) + '</span>' +
    '<span class="none">' + (mode.gaps ? 'unplanned · ' + run.length + ' weeks' : 'no sessions scheduled') + '</span>' +
    work.join('') +
    (mode.gaps ? '<button class="chip gap ' + tierOf(a.week) + '" data-pick="gap" data-id="module" data-weeks="' +
      esc(run.map(function (w) { return w.week; }).join(',')) + '">' + svgIcon('module') + 'Plan ' + esc(span.toLowerCase()) + '</button>' : '') +
    '</div>';
}

function leadMarkup(mode) {
  const items = undatedWork(mode);
  if (!items.length) return '';
  return '<div class="lead"><b>' + svgIcon('misdated') + ' ' + items.length + (items.length === 1 ? ' thing is' : ' things are') +
    ' not on the calendar yet</b>' +
    items.map(function (x) {
      return '<button class="chip ' + esc(x.tone) + '" data-pick="work" data-id="' + esc(x.id) +
        '" data-week="' + esc(x.week) + '">' + esc(x.title) + '</button>' +
        '<button class="chip gap" data-pick="gap" data-id="deadline" data-ref="' + esc(x.id) +
        '" data-week="' + esc(x.week) + '">' + svgIcon('calendar') + 'Set dates</button>';
    }).join('') + '</div>';
}

function Spine(props) {
  const ref = useRef(null);
  const html = useMemo(function () {
    try {
      const rows = rowsOf(DATA.weeks, props.mode);
      return { lead: leadMarkup(props.mode), markup: rows.map(function (row, i) {
        if (row.band) return bandMarkup(row.band, props.mode, props.layout, i === 0);
        const w = weekModel(row.week, props.mode, props.selected);
        // `first` is the first ROW, so the column heads survive a term whose
        // opening weeks are a band.
        w.first = i === 0;
        return tmpl(props.structure, { w: w });
      }).join('\n'), error: null };
    } catch (e) {
      return { lead: '', markup: '', error: e.message };
    }
  }, [props.structure, props.mode, props.selected, props.layout]);

  useEffect(function () { props.onError(html.error); }, [html.error]);

  const onClick = useCallback(function (e) {
    const el = e.target.closest('[data-pick]');
    if (!el || !ref.current.contains(el)) return;
    // Which week the press was in. `data-week` first, because a structure may
    // lay a week out as SIBLINGS rather than as a card — the term table puts
    // the heading and the three cells in one grid, so a cell is not inside the
    // thing carrying the week number and `closest('[data-pick=week]')` finds
    // nothing. That bailed out of every chip press in the table silently.
    const holder = el.closest('[data-week]');
    const card = el.closest('[data-pick="week"]');
    const number = holder ? holder.dataset.week : (card ? card.dataset.id : el.dataset.id);
    const week = DATA.weeks.filter(function (w) {
      return String(w.week) === String(number);
    })[0];
    // Work the run holds on no week at all sits in the lead card with an empty
    // `data-week`; it still selects, as a thing with no week.
    if (!week && !(holder && holder.dataset.week === '')) return;
    const weeks = el.dataset.weeks ? el.dataset.weeks.split(',').map(Number) : null;
    props.onSelect({ kind: el.dataset.pick, id: el.dataset.id, doc: el.dataset.doc || '',
                     ref: el.dataset.ref || '', weeks: weeks,
                     week: week || null, view: props.view });
    // A hole is a verb: pressing it starts the turn that fills it, with the
    // packet already in it, rather than selecting it and waiting for Ask.
    if (el.dataset.pick === 'gap') { props.onAsk(); return; }
    // A material or a brief opens on the press, the way it does in the harness:
    // the chip IS the link. It still selects, so the packet under it is about
    // the thing now on screen rather than whatever was pressed before it.
    if (el.dataset.doc) props.onOpen({ kind: 'doc', id: el.dataset.doc });
    else if (el.dataset.brief) props.onOpen({ kind: 'brief', id: el.dataset.brief });
  }, [props.view, props.onSelect, props.onOpen, props.onAsk]);

  if (html.error) return null;
  // The structure says how its own children are laid out; the chrome does not
  // guess. A structure with no `layout` gets the stacked column.
  return h('div', { ref: ref, onClick: onClick },
    html.lead ? h('div', { dangerouslySetInnerHTML: { __html: html.lead } }) : null,
    h('div', { className: 'spine ' + (props.layout || ''),
               dangerouslySetInnerHTML: { __html: html.markup } }));
}

// ---------------------------------------------------------------- workshop
function Workshop(props) {
  // The structure and appearance pickers live in the ⋯ menu; this is only the
  // source of whichever structure is chosen there.
  return h('div', { className: 'shop' },
    h('div', { className: 'lineup' },
      h('label', { htmlFor: 'structure-source' }, 'Template · ' + STRUCTURES[props.structureId].name),
      h('span', { className: 'hint' }, STRUCTURES[props.structureId].suits)),
    h('textarea', { value: props.draft, spellCheck: false, id: 'structure-source',
                    'aria-label': 'The structure for one week',
                    onChange: function (e) { props.onDraft(e.target.value); } }),
    props.error
      ? h('div', { className: 'err mono' }, props.error)
      : h('div', { className: 'ok mono' },
          'Parses. Every value is escaped on its way in, so this box cannot introduce markup ' +
          'and cannot compute a figure — {{{ }}} is a parse error, and there are no expressions.'));
}

// -------------------------------------------------------------- chat mode
function ChatMode() {
  const turns = [
    { who: 'professor', me: true, said: ['Where does CSS-4008 stand?'] },
    { who: 'exoskeleton', said: [
      'Validated first: 0 errors, 2 warnings, both on CRIT-01 where the items sum to 40 against a maximum of 60.',
      'Ten of sixteen weeks hold a module, and eight of the ten that meet have no deck. Every assessment is dated and weighted, so the grading policy is complete at 100%.',
      'The nearest thing that needs you is week 7 — it teaches on Tuesday and has no slides.'] },
    { who: 'professor', me: true, said: ['Do week 7.'] },
    { who: 'exoskeleton', said: [
      'MODULE-07 introduces regularisation and the bias–variance tradeoff, and week 6 already covered evaluation, so I will open on the failure it fixes rather than on the formula.',
      'Eighteen slides, registered in the course as a resource marked approval: draft. Students see none of it until you change that word in its record.'] },
  ];
  return h('div', { className: 'chatmode' },
    h('div', { className: 'convo' }, turns.map(function (t, i) {
      return h('div', { className: 'turn', key: i },
        h('div', { className: 'who' }, t.who),
        h('div', { className: 'said' + (t.me ? ' me' : '') },
          t.said.map(function (p, j) { return h('p', { key: j }, p); })));
    })),
    h('div', { className: 'pane' },
      h('div', { className: 'pane-tabs' },
        ['Course outline', 'Students', 'Progress', 'Tasks', 'Preferences', 'Integrations']
          .map(function (name, i) {
            return h('button', { key: name, type: 'button', 'aria-pressed': i === 0 }, name);
          })),
      h('div', { className: 'pane-sub' },
        h('b', null, 'Week by week'), h('span', null, 'Grading policy'),
        h('span', null, 'Assessments'), h('span', null, 'Slides'), h('span', null, 'Exams')),
      h('iframe', { title: 'The pane as it is today', srcDoc: PANE_DOC })));
}

// ------------------------------------------------- the outline's other three
//
// Lectures, Assessment and Quiz are the same records the table shows, read down
// a different axis. They are React rather than templates on purpose: a template
// earns its place where a professor would want to rearrange the thing, and what
// they rearrange is the week — not a list of every meeting in the term.

function Lectures(props) {
  const rows = [];
  DATA.weeks.forEach(function (week) {
    week.meetings.forEach(function (m) {
      const deck = (m.resources || []).filter(function (r) { return r.kind === 'slides'; })[0];
      rows.push({ week: week, meeting: m, deck: deck,
                  module: (week.modules[0] || {}).title || null });
    });
  });
  return h('div', { className: 'listing' },
    h(Scroll, { min: 760 },
      h('thead', null, h('tr', null,
        h('th', null, 'Wk'), h('th', null, 'When'), h('th', null, 'Type'),
        h('th', null, 'Where'), h('th', null, 'Module'), h('th', null, 'Slides'))),
      h('tbody', null, rows.map(function (r) {
        return h('tr', { key: r.meeting.activity_id, tabIndex: 0, onClick: function () {
          props.onSelect({ kind: 'meeting', id: r.meeting.activity_id, week: r.week, view: 'lectures' });
        } },
          h('td', { className: 'mono num' }, r.week.week),
          h('td', { className: 'mono' }, shortDate(r.meeting.on) +
            (r.meeting.scheduled_at ? ' · ' + r.meeting.scheduled_at.slice(11, 16) : '')),
          h('td', null, r.meeting.type),
          h('td', null, r.meeting.location || h('span', { className: 'dash' }, '—')),
          h('td', null, r.module || h('span', { className: 'dash' }, 'unplanned')),
          h('td', null, r.deck
            ? h('span', { className: 'chip deck' }, r.deck.title)
            : h('span', { className: 'chip gap' }, 'no deck')));
      }))),
    h('p', { className: 'foot' }, rows.length + ' meetings · ' +
      rows.filter(function (r) { return !r.deck; }).length + ' without a deck · ' +
      'duration and preparation are on the record and are not drawn here'));
}

function Assessments(props) {
  const rows = DATA.assessments.filter(function (a) {
    return props.only === 'quiz' ? a.type === 'quiz' : a.type !== 'quiz';
  });
  const inboxBy = {};
  DATA.inbox.assessments.forEach(function (a) { inboxBy[a.assessment_id] = a; });
  return h('div', { className: 'listing' },
    h(Scroll, { min: 860 },
      h('thead', null, h('tr', null,
        h('th', null, 'Assessment'), h('th', null, 'Type'), h('th', { className: 'num' }, 'Weight'),
        h('th', null, 'Opens'), h('th', null, 'Due'), h('th', { className: 'num' }, 'Criteria'),
        h('th', { className: 'num' }, props.only === 'quiz' ? 'Items' : 'Handed in'),
        h('th', null, 'Brief'))),
      h('tbody', null, rows.map(function (a) {
        const seen = inboxBy[a.assessment_id] || {};
        return h('tr', { key: a.assessment_id, tabIndex: 0, onClick: function () {
          props.onSelect({ kind: 'work', id: a.assessment_id,
                           week: weekOf(a.assessment_id), view: props.only === 'quiz' ? 'quiz' : 'assessment' });
        } },
          h('td', null, h('b', null, a.title),
            h('small', { className: 'mono' }, a.assessment_id)),
          h('td', null, a.type),
          h('td', { className: 'num mono' }, a.weight === null
            ? h('span', { className: 'chip gap' }, 'not set')
            : Math.round(a.weight * 100) + '%'),
          h('td', { className: 'mono' }, a.opens_on || h('span', { className: 'dash' }, '—')),
          h('td', { className: 'mono' }, a.due_on ||
            h('span', { className: 'chip gap' }, 'no deadline')),
          h('td', { className: 'num mono' }, a.criteria || h('span', { className: 'chip gap' }, '0')),
          h('td', { className: 'num mono' }, props.only === 'quiz'
            ? (seen.items || 0)
            : (seen.submissions_received || 0) + ' of ' + (seen.enrolled || DATA.enrolled)),
          // `open` where there is something to read, and `no brief` in the
          // same amber a missing weight gets. The brief is usually the
          // record's own description rather than a document — twelve of this
          // course's twenty-one assessments are that way — so keying this on
          // `instructions_document_id` alone said "no brief" about work whose
          // brief was written.
          h('td', null, (DATA.briefs[a.assessment_id] || {}).none
            ? h('span', { className: 'chip gap' }, 'no brief')
            : h('button', {
                className: 'chip', type: 'button',
                onClick: function (e) {
                  e.stopPropagation();
                  props.onOpenBrief(a.assessment_id);
                },
              }, 'open')));
      }))),
    h('p', { className: 'foot' }, props.only === 'quiz'
      ? rows.length + ' quiz, with its items — the answer key is deliberately not reachable ' +
        'from any view: assessment_rubric has no widget, because a component draws itself the ' +
        'moment a model decides it is relevant, in a window that gets projected.'
      : 'Weights total ' + Math.round(DATA.grading.total_weight * 100) + '%' +
        (DATA.grading.complete ? ', and the policy is complete.' : '. ' + (DATA.grading.note || ''))));
}

/** The week a piece of graded work sits in, so a press from a list still has one. */
function weekOf(assessmentId) {
  for (const week of DATA.weeks) {
    const found = week.due.concat(week.opens, week.undated).filter(function (a) {
      return a.assessment_id === assessmentId;
    })[0];
    if (found) return week;
  }
  return DATA.weeks[0];
}

// ------------------------------------------------------- students' progress
/**
 * One mark, as a glyph a row can be scanned by.
 *
 *   ●  graded — an approved percentage, the only figure the gradebook counts
 *   ◐  partly decided — how many criteria have the professor's decision
 *   ○  missing — due, and nothing handed in
 *   ·  not due yet — nothing handed in, and nothing is wrong with that
 *   ⚠  beside any of them: the rubric itself is inconsistent
 *
 * The reason a mark cannot be exported is the cell's title, on the cell it
 * explains, instead of a list of criterion ids under the table.
 */
function markCell(m) {
  const due = (DATA.assessments.filter(function (a) { return a.assessment_id === m.assessment_id; })[0] || {}).due_on;
  const scale = m.blocked.some(function (b) { return /wrong scale|sum to/.test(b); });
  const undecided = m.blocked.map(function (b) { return /(\d+) of (\d+) criteria undecided/.exec(b); })
    .filter(Boolean)[0];
  let glyph, text, tone;
  if (m.percent !== null && m.exportable) { glyph = '●'; text = Math.round(m.percent) + '%'; tone = 'ok'; }
  else if (undecided) {
    glyph = '◐'; tone = 'part';
    text = (Number(undecided[2]) - Number(undecided[1])) + '/' + undecided[2];
  } else if (m.status === 'not_submitted' || m.status === 'missing') {
    const late = due && DATA.as_of && due < DATA.as_of;
    glyph = late ? '○' : '·'; text = late ? 'missing' : 'not due'; tone = late ? 'miss' : 'wait';
  } else { glyph = '◐'; text = m.status.replace(/_/g, ' '); tone = 'part'; }
  const why = m.blocked.length ? m.blocked.join('\n') : 'exportable';
  return h('span', { className: 'mark ' + tone, title: why + (m.percent !== null && !m.exportable
      ? '\nso far: ' + Math.round(m.percent) + '% from the decided criteria' : '') },
    h('span', { className: 'g', 'aria-hidden': 'true' }, glyph), text,
    scale ? h('span', { className: 'warn', 'aria-label': 'rubric problem' }, ' ⚠') : null);
}

/** Who needs the professor first: open signals, then missing work, then a
 *  broken rubric, then how much is left to decide. Counted, not judged. */
function attentionOf(s) {
  let score = s.signals.length * 100;
  s.marks.forEach(function (m) {
    const due = (DATA.assessments.filter(function (a) { return a.assessment_id === m.assessment_id; })[0] || {}).due_on;
    if ((m.status === 'not_submitted' || m.status === 'missing') && due && DATA.as_of && due < DATA.as_of) score += 30;
    if (m.blocked.some(function (b) { return /wrong scale|sum to/.test(b); })) score += 20;
    const u = m.blocked.map(function (b) { return /(\d+) of \d+ criteria undecided/.exec(b); }).filter(Boolean)[0];
    if (u) score += Number(u[1]);
  });
  return score;
}

function Students(props) {
  const marks = DATA.students.length ? DATA.students[0].marks : [];
  const rows = DATA.students.slice().sort(function (a, b) { return attentionOf(b) - attentionOf(a); });
  return h('div', { className: 'listing' },
    // Wide by construction: one column per assessment, and a real course has
    // twenty-one of them. It scrolls; the page does not.
    h(Scroll, { min: 320 + 120 * (marks.length + 2) },
      h('thead', null, h('tr', null,
        h('th', null, 'Student'),
        h('th', null, 'Concepts with evidence'),
        marks.map(function (m) {
          return h('th', { key: m.assessment_id, title: m.title },
            TYPE_WORD[m.type] || m.type,
            h('small', null, m.title + (m.weight != null ? ' · ' + Math.round(m.weight * 100) + '%' : '')));
        }),
        h('th', null, 'Open signals'))),
      h('tbody', null, rows.map(function (s) {
        const seen = s.concepts.filter(function (c) { return c.proportion !== null; });
        return h('tr', { key: s.student_id, tabIndex: 0, onClick: function () {
          props.onSelect({ kind: 'student', id: s.student_id, student: s, view: 'students' });
        } },
          // The identifier stays under the name rather than being replaced by
          // it: it is what whois, the gradebook and a bug report all use.
          h('td', null,
            props.names && s.name
              ? [h('b', { key: 'n' }, s.name),
                 h('small', { key: 'p', className: 'mono' },
                   s.student_id + (s.group ? ' · ' + s.group : ''))]
              : h('span', { className: 'mono' },
                  s.student_id + (s.group ? ' · ' + s.group : ''))),
          // The bar and the count; which concepts, and how each landed, on hover.
          h('td', { title: seen.length ? seen.map(function (c) {
                      return c.title + ' ' + Math.round(c.proportion * 100) + '%';
                    }).join('\n') : 'nothing assessed yet' },
            h('span', { className: 'bar' }, h('i', {
              style: { width: Math.round((seen.length / Math.max(1, s.concepts.length)) * 100) + '%' } })),
            h('span', { className: 'mono num' },
              ' ' + seen.length + ' of ' + s.concepts.length)),
          s.marks.map(function (m) { return h('td', { key: m.assessment_id }, markCell(m)); }),
          h('td', null, s.signals.length
            ? s.signals.map(function (sig) {
                return h('span', { key: sig.signal_id, className: 'chip sig',
                                   title: sig.description }, icon('signal'), sig.type.replace(/_/g, ' '));
              })
            : h('span', { className: 'dash' }, '—')));
      }))),
    h('p', { className: 'foot key' },
      h('span', null, h('b', { className: 'mark ok' }, '●'), ' graded'),
      h('span', null, h('b', { className: 'mark part' }, '◐'), ' criteria decided'),
      h('span', null, h('b', { className: 'mark miss' }, '○'), ' missing'),
      h('span', null, h('b', { className: 'mark wait' }, '·'), ' not due'),
      h('span', null, h('b', { className: 'warn' }, '⚠'), ' rubric problem'),
      h('span', null, 'Rows: who needs you first. Hover a cell for why it cannot be exported.')),
    h('p', { className: 'foot' },
      'Not one figure here is a decision. A grade counts only from your professor_decision; an ' +
      'ai_suggestion is never counted, whatever its confidence.'));
}

/**
 * A material, over the page.
 *
 * The same veil the chat overlay uses, which is `MaterialModal`'s own geometry
 * in `lib/client.js` — because in the harness this IS MaterialModal. A deck is
 * 4:3 and a brief is a page; neither belongs in a column, which is the whole
 * argument for opening it over everything instead.
 *
 * What the panel can show is what the harness can frame. Markdown arrives
 * rendered, by the pane's own renderer and style. An SVG and a PDF are framed
 * as they are. A `.pptx` or `.docx` is rendered to PDF by LibreOffice first,
 * and this page says whether the machine that BUILT it had one. Anything with
 * a scheme in its storage key is object storage — student work, a dataset —
 * and says so rather than offering a link that would fail.
 */
function MaterialModal(props) {
  const close = props.onClose;
  const box = useRef(null);
  // Two things open here and they are the same act: a material is a file the
  // course registered, a brief is the record's own text about a piece of work.
  // `sendMaterial` and `sendBrief` are two routes for the same reason — one
  // serves bytes, the other composes a page — and both land in this panel.
  const brief = props.what.kind === 'brief' ? (DATA.briefs[props.what.id] || {}) : null;
  const material = brief
    ? (brief.doc ? DATA.materials[brief.doc] || {} : {})
    : (DATA.materials[props.what.id] || {});

  useEffect(function () {
    const onKey = function (e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    window.addEventListener('keydown', onKey, true);
    const previous = document.activeElement;
    if (box.current) box.current.focus();
    return function () {
      window.removeEventListener('keydown', onKey, true);
      if (previous && previous.focus) previous.focus();
    };
  }, [close]);

  let body;
  if (brief && brief.none) {
    body = h('div', { className: 'matnote' },
      h('b', null, 'No brief.'),
      h('p', null, 'This piece of graded work carries neither a brief document nor a ' +
        'description, so there is nothing for a student to read and nothing for this panel to ' +
        'show. The brief is the record’s own text — write it there and it appears here, ' +
        'which is what sendBrief says when it refuses.'));
  } else if (brief && brief.html) {
    body = h('iframe', { className: 'matframe', title: brief.title,
                         sandbox: 'allow-same-origin', srcDoc: brief.html });
  } else if (material.html) {
    // Framed rather than inlined, for the reason the harness frames it: a
    // brief may be a file downloaded from anywhere, and its markup has no
    // business inheriting this page's styles or reaching this page's DOM.
    body = h('iframe', { className: 'matframe', title: material.title,
                         sandbox: 'allow-same-origin', srcDoc: material.html });
  } else if (material.held) {
    body = h('div', { className: 'matnote' },
      h('b', null, 'Held ' + material.held + '.'),
      h('p', null, 'The model decides this, not the view: ' +
        'versions/<TERM>/samples/documents.yaml says in as many words that the bytes of student ' +
        'work live in object storage and never in the repository. A dead link that returned a ' +
        'sentence about object storage would be worse than no link at all.'));
  } else if (material.converts) {
    body = h('div', { className: 'matnote' },
      h('b', null, 'A .' + material.extension + ', rendered to PDF to be read.'),
      h('p', null, DATA.office
        ? 'The machine this page was built on has LibreOffice, so in the harness this opens ' +
          'here as a PDF — converted once, cached by the source file’s size and mtime, and ' +
          'framed without a sandbox because the browser’s PDF viewer is a document of its ' +
          'own. The bytes are not embedded in this page, which is why you are reading this ' +
          'instead of the deck.'
        : 'The machine this page was built on has no LibreOffice, so in the harness this would ' +
          'keep the tab it has always opened. The offer is a capability, not a flag: where ' +
          'there is no converter there is no control.'));
  } else {
    body = h('div', { className: 'matnote' },
      h('b', null, 'Nothing to frame.'),
      h('p', null, 'A .' + (material.extension || 'file') + ' is not on the showable list and ' +
        'is not one LibreOffice renders, so the harness keeps the tab it always opened.'));
  }

  return ReactDOM.createPortal(
    h('div', { className: 'veil',
               onMouseDown: function (e) { if (e.target === e.currentTarget) close(); } },
      h('div', { className: 'modal', role: 'dialog', 'aria-modal': 'true', tabIndex: -1, ref: box,
                 'aria-label': (brief ? brief.title : material.title) || props.what.id,
                 onMouseDown: function (e) { e.stopPropagation(); } },
        h('header', null,
          h('b', null, (brief ? brief.title : material.title) || props.what.id),
          h('span', { className: 'where mono' },
            // Where what is ON SCREEN came from, not what else exists. An
            // assessment can have both a description and an attached document
            // — HW1 does — and a header naming the document above the record's
            // own text would be crediting the wrong one.
            brief
              ? (brief.html
                  ? 'brief · the record’s own text' + (brief.doc ? ' · also ' + brief.doc : '')
                  : 'brief · ' + brief.doc)
              : (material.extension ? '.' + material.extension : '')),
          h('button', { className: 'ghost', type: 'button', onClick: close }, 'Back to the course'),
          h('button', { className: 'x', type: 'button', onClick: close, 'aria-label': 'Close' }, '×')),
        body)),
    document.body);
}

/**
 * A table in its own scroll box.
 *
 * Twenty-one assessments and a concept column is twenty-four columns, which is
 * what a real course turned out to have — the example has seven. Past that the
 * columns crush rather than the page scrolling, and the fix is the rule every
 * wide table on a responsive page needs: the TABLE scrolls sideways inside its
 * own container, and the page body never does.
 */
function Scroll(props) {
  return h('div', { className: 'scroll' },
    h('table', { style: props.min ? { minWidth: props.min + 'px' } : null }, props.children));
}

/** A fixture name for a pseudonym, or nothing. Never used in a packet. */
function nameOf(studentId) {
  const found = DATA.students.filter(function (s) { return s.student_id === studentId; })[0];
  return found ? found.name : null;
}

// ------------------------------------------------------------------- todos
// ------------------------------------------------------------ planning mode
/**
 * Does the term hold together.
 *
 * Asked at the start of a term, of the term as a structure: is every week
 * teaching something, in an order that builds, with quizzes and homework
 * spread across it, weighted to a whole. So the page is three things and
 * nothing else — the weights against 100%, one row per week with its topic
 * and the graded work running through it as lanes, and the faults said as
 * sentences with one press each. No room, no meeting time, no deck, no
 * student: those are teaching questions, asked later.
 *
 * Every figure is `DATA.planning`'s, counted in `build.mjs`.
 */
const LANE_ORDER = ['Quizzes', 'Homework', 'Project', 'Exams', 'Other'];
const LANE_TONE = { Quizzes: 'q', Homework: 'hw', Project: 'pj', Exams: 'ex', Other: 'ot' };
const pctOf = function (v) { return v == null ? '—' : Math.round(v * 100) + '%'; };

function Planning(props) {
  const P = DATA.planning;
  const lanes = LANE_ORDER.filter(function (l) { return P.spans.some(function (s) { return s.lane === l; }); });
  const weekAt = function (n) { return DATA.weeks.filter(function (w) { return w.week === n; })[0]; };

  // Faults, as sentences. Unplanned runs from the payload's own gaps; quiet
  // runs and the weight verdict from `DATA.planning`; undated work from the
  // same card the outline draws.
  const faults = [];
  const unplanned = [];
  DATA.weeks.forEach(function (w) {
    if (openGaps(w, OUTLINE_MODE.prof).some(function (g) { return g.kind === 'module'; })) unplanned.push(w.week);
  });
  const runs = [];
  unplanned.forEach(function (n) {
    const last = runs[runs.length - 1];
    if (last && last[last.length - 1] === n - 1) last.push(n); else runs.push([n]);
  });
  runs.forEach(function (r) {
    faults.push({ tone: 'flag', icon: 'module',
      text: (r.length === 1 ? 'Week ' + r[0] + ' has' : 'Weeks ' + r[0] + '–' + r[r.length - 1] + ' have') + ' no topic',
      verb: r.length === 1 ? 'Plan week ' + r[0] : 'Plan these weeks',
      sel: { kind: 'gap', id: 'module', weeks: r.length > 1 ? r : null, week: weekAt(r[0]), view: 'planning' } });
  });
  P.quiet.forEach(function (q) {
    const weeks = [];
    for (let n = q.from; n <= q.to; n += 1) weeks.push(n);
    faults.push({ tone: 'warn', icon: 'quiz',
      text: 'Weeks ' + q.from + '–' + q.to + ': nothing graded opens, runs or falls due',
      verb: 'Suggest an assessment',
      sel: { kind: 'gap', id: 'quiet', weeks: weeks, week: weekAt(q.from), view: 'planning' } });
  });
  undatedWork(OUTLINE_MODE.prof).forEach(function (x) {
    faults.push({ tone: 'flag', icon: 'calendar', text: x.title + ' has no dates',
      verb: 'Set dates',
      sel: { kind: 'gap', id: 'deadline', ref: x.id, week: weekAt(x.week) || DATA.weeks[0], view: 'planning' } });
  });
  if (!P.complete) {
    faults.push({ tone: 'flag', icon: 'weight', text: P.note || 'The weights do not add up to 100%',
      verb: 'Fix the weights', sel: { kind: 'gap', id: 'weights', week: DATA.weeks[0], view: 'planning' } });
  }

  const cell = function (w, lane) {
    const here = P.spans.filter(function (s) {
      return s.lane === lane && s.start !== null && s.end !== null && w.week >= s.start && w.week <= s.end;
    });
    if (!here.length) return h('td', { key: lane, className: 'lane' });
    return h('td', { key: lane, className: 'lane' }, here.map(function (s) {
      const first = w.week === s.start, last = w.week === s.end;
      return h('button', {
        key: s.assessment_id, type: 'button',
        className: 'lseg ' + LANE_TONE[lane] + (first ? ' first' : '') + (last ? ' last' : ''),
        title: s.title + (s.opens_on ? ' · opens ' + shortDate(s.opens_on) : '') +
          (s.due_on ? ' · due ' + shortDate(s.due_on) : '') + ' · ' + pctOf(s.weight),
        onClick: function () { props.onSelect({ kind: 'work', id: s.assessment_id, week: w, view: 'planning' }); },
      },
        first ? h('span', { className: 'segt' }, s.title) : null,
        last ? h('span', { className: 'segd' }, 'due ' + shortDate(s.due_on) + ' · ' + pctOf(s.weight)) : null);
    }));
  };

  return h('div', { className: 'mode' },
    h('div', { className: 'weights' },
      P.weights.map(function (g) {
        return h('div', { key: g.name, className: 'wcard' },
          h('small', null, g.name),
          h('b', null, pctOf(g.weight)),
          h('small', null, g.count + (g.count === 1 ? ' item' : ' items') +
            (g.unweighted ? ' · ' + g.unweighted + ' with no weight' : '')));
      }),
      h('div', { className: 'wcard ' + (P.complete ? 'ok' : 'bad') },
        h('small', null, 'Total'),
        h('b', null, pctOf(P.total_weight)),
        h('small', null, P.complete ? 'weights add up' : 'does not add up'))),
    faults.length
      ? h('ul', { className: 'faults' }, faults.map(function (f, i) {
          return h('li', { key: i, className: f.tone },
            icon(f.icon), h('span', null, f.text),
            h('button', { type: 'button', className: 'ghost', onClick: function () { props.onAsk(f.sel); } },
              icon('ask'), f.verb));
        }))
      : h('p', { className: 'calm' }, icon('approve'), ' Every week has a topic, the graded work is spread, and the weights add up.'),
    h('div', { className: 'listing' }, h('div', { className: 'scroll' },
      h('table', { className: 'plan' },
        h('thead', null, h('tr', null,
          h('th', null, 'Week'), h('th', null, 'Topic'),
          lanes.map(function (l) { return h('th', { key: l, className: 'lanehead ' + LANE_TONE[l] }, l); }))),
        h('tbody', null, DATA.weeks.map(function (w) {
          const proposed = DATA.proposed.modules[w.week];
          const title = w.modules.map(function (m) { return m.title; }).join(' · ');
          const concepts = w.modules.reduce(function (n, m) { return n + m.concepts.length; }, 0);
          return h('tr', { key: w.week, className: w.week === DATA.current_week ? 'now' : '' },
            h('td', { className: 'wkn' }, h('b', null, w.week), h('small', null, shortDate(w.starts_on))),
            h('td', { className: 'topic' },
              title
                ? [h('span', { key: 't' }, title),
                   concepts ? h('small', { key: 'c' }, concepts + (concepts === 1 ? ' concept' : ' concepts')) : null]
                : proposed
                  ? [h('span', { key: 't', className: 'draftword' }, proposed.title), h('small', { key: 'd' }, 'draft')]
                  : h('span', { className: 'notopic' }, 'No topic yet')),
            lanes.map(function (l) { return cell(w, l); }));
        })))),
      h('p', { className: 'foot' }, 'Each bar runs from the week a piece of work opens to the week it is due. ' +
        'Press one to see it. Rooms, times and decks are teaching questions — they are in Teaching.')));
}

// ------------------------------------------------------------ teaching mode
/**
 * This week, between the last one and the next.
 *
 * Asked during the term, of one week at a time: what am I teaching, is it
 * ready, what is due, and what from last week do I build on or repair. So
 * the week in focus is the large card in the middle, and its neighbours are
 * the context it needs — what was taught and handed in before it, what has to
 * be ready after it. ‹ › moves the focus through the term.
 *
 * Private: the class figures — a concept's class mean over approved evidence,
 * and what has been handed in — are derived from student work, which is why
 * this is a mode of its own and not a layer on the outline a student may see.
 */
function Teaching(props) {
  const [focus, setFocus] = useState(DATA.current_week || 1);
  const T = DATA.teaching;
  const weekAt = function (n) { return DATA.weeks.filter(function (w) { return w.week === n; })[0] || null; };
  const cur = weekAt(focus), prev = weekAt(focus - 1), next = weekAt(focus + 1);
  if (!cur) return h('p', { className: 'calm' }, 'No week ' + focus + ' in this run.');

  const titleOf = function (w) {
    const t = w.modules.map(function (m) { return m.title; }).join(' · ');
    const p = DATA.proposed.modules[w.week];
    return t || (p ? p.title + ' (draft)' : 'No topic yet');
  };
  const conceptsOf = function (w) {
    return w.modules.reduce(function (all, m) { return all.concat(m.concepts); }, []);
  };
  const hasDeck = function (w) {
    return w.meetings.some(function (m) { return (m.resources || []).some(function (r) { return r.kind === 'slides'; }); });
  };
  const handed = function (a) {
    const x = T.handed_in[a.assessment_id];
    return x && x.enrolled ? x.received + ' of ' + x.enrolled + ' handed in' : '';
  };
  const workLine = function (a, verb, date, w) {
    const brief = DATA.briefs[a.assessment_id] || {};
    return h('li', { key: verb + a.assessment_id },
      icon(WORK_ICON[a.type] || 'file'),
      h('button', { type: 'button', className: 'link',
        onClick: function () {
          props.onSelect({ kind: 'work', id: a.assessment_id, week: w, view: 'teaching' });
          if (!brief.none) props.onOpen({ kind: 'brief', id: a.assessment_id });
        } }, a.title),
      h('small', null, verb + ' ' + shortDate(date) + (a.weight != null ? ' · ' + pctOf(a.weight) : '') +
        (verb === 'due' && handed(a) ? ' · ' + handed(a) : '')));
  };
  const deckRow = function (w) {
    if (hasDeck(w) || !w.meetings.length) return null;
    return h('div', { className: 'need' }, icon('slides'), h('span', null, 'No slides yet'),
      h('button', { type: 'button', className: 'ghost',
        onClick: function () { props.onAsk({ kind: 'gap', id: 'deck', week: w, view: 'teaching' }); } },
        icon('ask'), 'Draft slides'));
  };

  // What to repair before building on it: concepts taught in the two weeks
  // before the focus whose class mean sits under the line `build.mjs` set.
  const revisit = [];
  [focus - 1, focus - 2].forEach(function (n) {
    const w = weekAt(n);
    if (!w) return;
    conceptsOf(w).forEach(function (c) {
      const x = T.concepts[c.id];
      if (x && x.class_mean !== null && x.class_mean < T.revisit_below) {
        revisit.push({ id: c.id, title: c.title, mean: x.class_mean, coverage: x.coverage, week: n });
      }
    });
  });
  const signals = DATA.todos.filter(function (t) { return t.kind === 'signal'; });

  const side = function (w, label) {
    if (!w) return h('div', { className: 'side empty' }, h('small', null, label), h('p', null, 'Outside the run.'));
    const evidence = conceptsOf(w).map(function (c) {
      const x = T.concepts[c.id];
      return h('li', { key: c.id }, icon('concept'), h('span', null, c.title),
        h('small', null, x && x.class_mean !== null ? 'class ' + pctOf(x.class_mean) + ' · ' + x.coverage : 'not assessed yet'));
    });
    return h('div', { className: 'side' },
      h('small', null, label + ' · week ' + w.week),
      h('b', null, titleOf(w)),
      h('ul', { className: 'facts' },
        w.meetings.map(function (m) {
          return h('li', { key: m.activity_id }, icon(MEETING_ICON[m.type] || 'lecture'),
            h('span', null, shortDate(m.on) + ' · ' + m.type), h('small', null, m.location || ''));
        }),
        w.opens.map(function (a) { return workLine(a, 'opens', a.opens_on, w); }),
        w.due.map(function (a) { return workLine(a, 'due', a.due_on, w); }),
        w.week < (DATA.current_week || 0) ? evidence : null),
      deckRow(w),
      h('button', { type: 'button', className: 'link', onClick: function () { setFocus(w.week); } },
        'Make this the focus ›'));
  };

  const misdated = (cur.gaps || []).filter(function (g) { return g.kind === 'misdated'; })[0];

  return h('div', { className: 'mode' },
    h('div', { className: 'stepper' },
      h('button', { type: 'button', className: 'ghost', disabled: !prev, onClick: function () { setFocus(focus - 1); } }, '‹ Week ' + (focus - 1)),
      h('b', null, 'Week ' + focus + ' of ' + DATA.weeks.length),
      focus !== DATA.current_week && DATA.current_week
        ? h('button', { type: 'button', className: 'ghost', onClick: function () { setFocus(DATA.current_week); } }, 'Back to this week')
        : null,
      h('button', { type: 'button', className: 'ghost', disabled: !next, onClick: function () { setFocus(focus + 1); } }, 'Week ' + (focus + 1) + ' ›'),
      h('span', { className: 'private' }, 'Private — class figures from approved evidence only')),
    h('div', { className: 'trio' },
      side(prev, 'Before'),
      h('div', { className: 'focus' },
        h('small', null, (focus === DATA.current_week ? 'This week' : 'Week ' + focus) + ' · ' +
          shortDate(cur.starts_on) + ' – ' + shortDate(cur.ends_on)),
        h('h2', null, titleOf(cur)),
        conceptsOf(cur).length
          ? h('div', { className: 'row' }, conceptsOf(cur).map(function (c) {
              return h('span', { key: c.id, className: 'chip concept' }, c.title);
            }))
          : null,
        h('ul', { className: 'facts big' },
          cur.meetings.map(function (m) {
            const mats = (m.resources || []).filter(function (r) { return r.kind !== 'slides'; });
            const deck = (m.resources || []).filter(function (r) { return r.kind === 'slides'; })[0];
            return h('li', { key: m.activity_id }, icon(MEETING_ICON[m.type] || 'lecture'),
              h('span', null, shortDate(m.on) + ' · ' + m.type + (m.location ? ' · ' + m.location : '')),
              deck ? h('button', { type: 'button', className: 'chip deck',
                onClick: function () { if (deck.document_id) props.onOpen({ kind: 'doc', id: deck.document_id }); } },
                icon('slides'), 'Slides') : null,
              mats.map(function (r) {
                return h('button', { key: r.resource_id, type: 'button', className: 'chip',
                  onClick: function () { if (r.document_id) props.onOpen({ kind: 'doc', id: r.document_id }); } },
                  icon(RESOURCE_ICON[r.kind] || 'file'), r.title);
              }));
          })),
        // Said in the week's own terms, not the model's: the model's sentence
        // stays on the title for anyone who wants the record ids.
        misdated
          ? h('div', { className: 'need warn', title: misdated.note }, icon('misdated'),
              h('span', null, misdated.ids.map(function (id) {
                const m = cur.meetings.filter(function (x) { return x.activity_id === id; })[0] || {};
                return (m.type ? m.type.charAt(0).toUpperCase() + m.type.slice(1) : 'A meeting') +
                  ' dated ' + shortDate(m.on) + ', ' + (m.on < cur.starts_on
                    ? 'before this week starts (' + shortDate(cur.starts_on) + ')'
                    : 'after this week ends (' + shortDate(cur.ends_on) + ')');
              }).join('; ')),
              h('button', { type: 'button', className: 'ghost',
                onClick: function () { props.onAsk({ kind: 'gap', id: 'misdated', ref: misdated.ids[0], week: cur, view: 'teaching' }); } },
                icon('ask'), 'Check date'))
          : null,
        deckRow(cur),
        cur.opens.length || cur.due.length
          ? h('ul', { className: 'facts' },
              cur.opens.map(function (a) { return workLine(a, 'opens', a.opens_on, cur); }),
              cur.due.map(function (a) { return workLine(a, 'due', a.due_on, cur); }))
          : h('p', { className: 'calm' }, 'Nothing graded opens or falls due this week.'),
        revisit.length
          ? h('div', { className: 'revisit' }, h('b', null, 'Revisit first'),
              revisit.map(function (r) {
                return h('p', { key: r.id }, r.title + ' — class ' + pctOf(r.mean) + ' on ' + r.coverage +
                  ' observed, taught in week ' + r.week);
              }),
              signals.length ? h('p', null, signals.length + (signals.length === 1 ? ' open signal: ' : ' open signals: ') +
                signals[0].title) : null)
          : null,
        h('button', { type: 'button', className: 'primary',
          onClick: function () { props.onAsk({ kind: 'week', id: String(focus), week: cur, view: 'teaching' }); } },
          icon('ask'), 'Prepare this week')),
      side(next, 'After')));
}

function Todos(props) {
  return h('div', { className: 'listing' },
    h('ul', { className: 'todos' }, DATA.todos.map(function (t) {
