// ------------------------------------------------------------------- app
function App() {
  const [mode, setMode] = useState(function () { return recall('proto.mode', 'course'); });
  // Teaching while the run is under way, Planning before it starts or after
  // it ends — decided by whether the run has a current week at all.
  const [section, setSection] = useState(DATA.current_week ? 'teaching' : 'planning');
  // Two separate questions the old row of five buttons asked as one: what the
  // outline is read by, and whether it is being previewed as a student sees it.
  // The second only means something when it is read by week.
  const [group, setGroup] = useState('week');
  const [preview, setPreview] = useState(false);
  const view = group === 'week' ? (preview ? 'student' : 'prof') : group;
  const [menu, setMenu] = useState(false);
  const [shop, setShop] = useState(false);
  const [structureId, setStructureId] = useState('table');
  const [draft, setDraft] = useState(STRUCTURES.table.tmpl);
  const [appearanceId, setAppearanceId] = useState('plain');
  const [error, setError] = useState(null);
  const [sel, setSel] = useState(null);
  const [asking, setAsking] = useState(false);
  const [opened, setOpened] = useState(null);
  // Pseudonyms by default here, which is the opposite of the harness's own
  // default — this page can be shared, and the harness runs on one machine.
  const [names, setNames] = useState(false);

  useEffect(function () { remember('proto.mode', mode); }, [mode]);
  useEffect(function () {
    const onKey = function (e) {
      if (e.key === 'Escape') { setAsking(false); setSel(null); setMenu(false); return; }
      // A week, a row or a todo is focusable but not a <button>, so Enter and
      // Space do what a press does — the same click the delegated listeners
      // already handle, so the keyboard takes no second path through the page.
      const t = e.target;
      if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute &&
          t.getAttribute('tabindex') === '0' && !/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(t.tagName)) {
        e.preventDefault();
        t.click();
      }
    };
    window.addEventListener('keydown', onKey);
    return function () { window.removeEventListener('keydown', onKey); };
  }, []);
  // The menu closes on any press outside it, the way every menu does.
  useEffect(function () {
    if (!menu) return;
    const onDown = function (e) { if (!e.target.closest('.menu-wrap')) setMenu(false); };
    document.addEventListener('mousedown', onDown);
    return function () { document.removeEventListener('mousedown', onDown); };
  }, [menu]);
  // The sticky offsets and the room at the foot, from the bars' real heights.
  useEffect(function () {
    const root = document.documentElement.style;
    const watch = [['.topbar', '--top-h'], ['.strip', '--strip-h'], ['.inspect', '--inspect-h']];
    const measure = function () {
      watch.forEach(function (p) {
        const el = document.querySelector(p[0]);
        root.setProperty(p[1], (el ? el.offsetHeight : 0) + 'px');
      });
    };
    measure();
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(measure);
    watch.forEach(function (p) { const el = document.querySelector(p[0]); if (el) ro.observe(el); });
    return function () { ro.disconnect(); };
  });

  const chooseStructure = useCallback(function (id) {
    setStructureId(id);
    setDraft(STRUCTURES[id].tmpl);
  }, []);

  const skin = APPEARANCE[appearanceId].css;
  const gaps = DATA.totals.gaps;
  const ranked = rankedGaps();
  const packet = packetFor(sel);

  // Everything that changes how the page is drawn rather than what it shows,
  // behind one button: the chat-mode comparison, the structure and the
  // appearance, and the template editor that used to sit under every week.
  const seg = function (options, current, choose) {
    return h('span', { className: 'seg' }, options.map(function (o) {
      return h('button', { key: o[0], type: 'button', title: o[2] || undefined,
                           'aria-pressed': current === o[0],
                           onClick: function () { choose(o[0]); } }, o[3] ? icon(o[3]) : null, o[1]);
    }));
  };
  const settings = h('div', { className: 'menu-wrap' },
    h('button', { className: 'ghost', type: 'button', 'aria-haspopup': 'true', 'aria-expanded': menu,
                  'aria-label': 'Page settings', onClick: function () { setMenu(!menu); } }, icon('settings')),
    menu ? h('div', { className: 'menu', role: 'menu' },
      h('div', null, h('label', null, 'Arrangement'),
        seg([['course', 'Course mode'], ['chat', 'Chat mode', 'the pane as it ships today']], mode,
            function (m) { setMode(m); setMenu(false); })),
      mode === 'course' ? h('div', null, h('label', null, 'Week structure'),
        seg(Object.keys(STRUCTURES).map(function (id) {
          return [id, STRUCTURES[id].name, STRUCTURES[id].suits];
        }), structureId, chooseStructure),
        h('span', { className: 'hint' }, STRUCTURES[structureId].suits)) : null,
      mode === 'course' ? h('div', null, h('label', null, 'Appearance'),
        seg(Object.keys(APPEARANCE).map(function (id) { return [id, APPEARANCE[id].name]; }),
            appearanceId, setAppearanceId)) : null,
      mode === 'course' ? h('label', { className: 'pick' },
        h('input', { type: 'checkbox', checked: shop, onChange: function (e) { setShop(e.target.checked); } }),
        'Show the template editor') : null) : null);

  const top = h('div', { className: 'topbar' },
    h('div', { className: 'brand' },
      h('b', null, DATA.run.course_id + ' — ' + DATA.run.title),
      h('span', { className: 'mono' },
        DATA.run.term + ' · week ' + DATA.current_week + ' of ' + DATA.totals.weeks +
        ' · ' + DATA.enrolled + ' enrolled')),
    mode === 'course'
      ? seg(SECTIONS.map(function (s) { return [s.id, s.label, s.hint, s.icon]; }), section,
            function (id) { setSection(id); setSel(null); })
      : null,
    mode === 'course'
      ? h('button', { className: 'primary', type: 'button', onClick: function () { setAsking(true); } }, icon('ask'), 'Ask')
      : null,
    settings);

  // The appearance half is embedded as text, so it is checked for markup the
  // way `templates.ts` checks a style sheet rather than escaped into safety.
  const style = MARKUP.test(skin) ? '' : ':root{' + skin + '}';

  if (mode === 'chat') {
    return h('div', null, top, h(ChatMode), h(Explainer, { mode: mode }));
  }

  const isTable = section === 'outline' && (view === 'student' || view === 'prof');
  const hint = section === 'outline'
    ? (OUTLINE_VIEWS.filter(function (v) { return v.id === view; })[0] || {}).hint
    : (SECTIONS.filter(function (s) { return s.id === section; })[0] || {}).hint;

  const named = section === 'students' || section === 'todos';

  // A press in either mode is the term table's own: select, then ask.
  const askAbout = function (selection) { setSel(selection); setAsking(true); };

  let body;
  if (section === 'planning') body = h(Planning, { onAsk: askAbout, onSelect: setSel });
  else if (section === 'teaching') body = h(Teaching, { onAsk: askAbout, onSelect: setSel, onOpen: setOpened });
  else if (section === 'students') body = h(Students, { onSelect: setSel, names: names });
  else if (section === 'todos') body = h(Todos, { onSelect: setSel, names: names });
  else if (view === 'lectures') body = h(Lectures, { onSelect: setSel });
  else if (view === 'assessment') body = h(Assessments, { only: 'other', onSelect: setSel,
    onOpenBrief: function (id) { setOpened({ kind: 'brief', id: id }); } });
  else if (view === 'quiz') body = h(Assessments, { only: 'quiz', onSelect: setSel,
    onOpenBrief: function (id) { setOpened({ kind: 'brief', id: id }); } });
  else body = h(Spine, { structure: draft, mode: OUTLINE_MODE[view], view: view,
                         onSelect: setSel, onError: setError, onOpen: setOpened,
                         onAsk: function () { setAsking(true); },
                         layout: STRUCTURES[structureId].layout,
                         selected: sel && sel.week ? sel.week.week : null });

  return h('div', null,
    h('style', null, style),
    top,
    h('div', { className: 'strip' },
      section === 'outline'
        ? h('label', { className: 'pick' }, 'Group by',
            h('select', { value: group, onChange: function (e) { setGroup(e.target.value); setSel(null); } },
              GROUPS.map(function (g) { return h('option', { key: g[0], value: g[0] }, g[1]); })))
        : null,
      section === 'outline'
        ? h('label', { className: 'pick' + (group === 'week' ? '' : ' off'),
                       title: group === 'week' ? 'the record only — what ainar page publishes'
                                               : 'only the week view has a student version' },
            h('input', { type: 'checkbox', checked: preview && group === 'week', disabled: group !== 'week',
                         onChange: function (e) { setPreview(e.target.checked); setSel(null); } }),
            'Preview as student')
        : null,
      h('span', { className: 'hint' }, hint),
      // Only where a student can be named, and only ever affirmatively — the
      // same two places the pane offers it, for the same reason.
      named
        ? h('div', { className: 'seg', style: { marginLeft: 'auto' } },
            h('button', { type: 'button', 'aria-pressed': !names,
                          title: 'what whois, the gradebook and a bug report all use',
                          onClick: function () { setNames(false); } }, 'Pseudonyms'),
            h('button', { type: 'button', 'aria-pressed': names,
                          title: 'fixture names, invented for this prototype',
                          onClick: function () { setNames(true); } }, 'Names'))
        : null,
      section === 'todos' && !named
        ? h('div', { className: 'tally' },
            h('span', null, DATA.todos.length + ' waiting'))
        : null,
      section === 'outline' && view === 'prof'
        // Ranked the way the chips are, so the strip answers "what before
        // Tuesday" rather than "how much is missing in all".
        ? h('div', { className: 'tally', title: gaps.module + ' weeks with no module · ' +
                       gaps.deck + ' with no deck · ' + gaps.deadline + ' undated · ' + gaps.weight + ' unweighted' },
            h('span', { className: ranked.soon ? 'soon' : 'zero' },
              ranked.soon + ' this week or next'),
            h('span', { className: ranked.later ? '' : 'zero' }, ranked.later + ' later'),
            h('span', { className: 'past' }, ranked.past + ' in weeks taught'))
        : null),
    // The coloured rule the pane draws whenever names are showing. It exists
    // because this thing gets screen-shared and thrown at lecture-hall
    // projectors, and a professor who left Names on should be told by the
    // chrome rather than by the room.
    named && names
      ? h('div', { className: 'rule' },
          h('b', null, 'Names are showing. '),
          'These three are fixtures invented for this prototype — no roster was read, and ' +
          'there is none in this workspace to read. In the harness they would resolve from ' +
          '~/.ainar/roster/people.json, be held for one response, and never enter a payload. ' +
          'The identifier stays under each name, and the packet a press sends carries the ' +
          'pseudonym alone, because that text goes to a model.')
      : null,
    section === 'outline' && view === 'prof'
      ? h('div', { className: 'banner' }, h('b', null, 'Drafts are included. '), DATA.proposed.note)
      : null,
    section === 'outline' && view === 'student'
      ? h('div', { className: 'banner student' }, h('b', null, 'The student view. '),
          'The record only — no draft, no gap, no note about what has not been written. This is ' +
          'what ainar page publishes, and the reason sections.gaps is the one flag a surface has ' +
          'to ask for by name.')
      : null,
    error && isTable ? h('div', { className: 'banner err mono', style: { maxWidth: 'none' } },
              'The structure does not parse: ' + error) : null,
    body,
    isTable && shop
      ? h(Workshop, { structureId: structureId, draft: draft, error: error, appearanceId: appearanceId,
                      onStructure: chooseStructure, onDraft: setDraft, onAppearance: setAppearanceId })
      : null,
    h(Explainer, { mode: mode, section: section, view: view }),
    sel ? h('div', { className: 'inspect-room', 'aria-hidden': 'true' }) : null,
    sel ? h(Inspector, { sel: sel, packet: packet, onAsk: function () { setAsking(true); },
                         onOpen: sel.doc
                           ? function () { setOpened({ kind: 'doc', id: sel.doc }); }
                           : (sel.kind === 'work' && !(DATA.briefs[sel.id] || {}).none
                               ? function () { setOpened({ kind: 'brief', id: sel.id }); }
                               : null),
                         onClose: function () { setSel(null); } }) : null,
    opened ? h(MaterialModal, { key: opened.kind + ':' + opened.id, what: opened,
                                onClose: function () { setOpened(null); } }) : null,
    // Keyed on what it was opened over, so pressing Ask on a different week
    // opens a turn about that week rather than reusing the last one.
    asking ? h(ChatOverlay, { key: sel ? sel.kind + ':' + sel.id : 'run', sel: sel, packet: packet,
                              onClose: function () { setAsking(false); } }) : null);
}

function whereOf(sel) {
  if (!sel) return 'the whole run';
  if (sel.kind === 'student') return 'student ' + sel.id;
  if (sel.kind === 'todo') return sel.todo.kind + ' · ' + sel.id;
  if (!sel.week) return sel.kind + ' ' + sel.id;
  if (sel.weeks) return sel.kind + ' · weeks ' + sel.weeks[0] + '–' + sel.weeks[sel.weeks.length - 1];
  return sel.kind + ' · week ' + sel.week.week +
    (sel.week.modules[0] ? ' · ' + sel.week.modules[0].title : '');
}

const GAP_SAID = { quiet: 'nothing graded', weights: 'weights that do not add up',
                   deck: 'no deck', module: 'no module', deadline: 'undated work',
                   weight: 'unweighted work', brief: 'no brief',
                   misdated: 'a meeting dated outside the week' };

function isDraft(id) {
  const p = DATA.proposed;
  return [p.modules, p.decks, p.assessments].some(function (table) {
    return Object.keys(table).some(function (k) {
      const r = table[k];
      return r.approval === 'draft' && (r.module_id === id || r.resource_id === id || r.assessment_id === id);
    });
  });
}

function titleOfWork(id) {
  return (DATA.briefs[id] || {}).title || id;
}

/**
 * The packet, said the way a person would say it. The JSON is still one press
 * away, because it is what the model receives — but the professor reading the
 * bar wants to know what Claude will be told, not how it is spelled.
 */
function sayOf(sel) {
  if (sel.kind === 'student') {
    const none = sel.student.concepts.filter(function (c) { return c.proportion === null; }).length;
    return sel.id + ' · ' + none + ' concept' + (none === 1 ? '' : 's') + ' with no evidence' +
      (sel.student.signals.length ? ' · ' + sel.student.signals.length + ' open signal' : '');
  }
  if (sel.kind === 'todo') return sel.todo.title;
  if (!sel.week) return titleOfWork(sel.id);
  const w = sel.week;
  const where = sel.weeks
    ? 'Weeks ' + sel.weeks[0] + '–' + sel.weeks[sel.weeks.length - 1]
    : 'Week ' + w.week + (w.modules[0] ? ' · ' + w.modules[0].title : '');
  if (sel.kind === 'week') {
    const missing = w.gaps.map(function (g) { return GAP_SAID[g.kind]; });
    return where + (missing.length ? ' · ' + missing.join(', ') : ' · nothing missing');
  }
  if (sel.kind === 'gap') {
    if (sel.id === 'misdated') return where + ' · ' + sel.ref + ' · ' + misdatedNote(sel.ref, OUTLINE_MODE.prof);
    return where + ' · ' + GAP_SAID[sel.id] + (sel.ref ? ' for ' + titleOfWork(sel.ref) : '');
  }
  if (sel.kind === 'work') return where + ' · ' + titleOfWork(sel.id);
  if (sel.kind === 'meeting') {
    const m = w.meetings.filter(function (x) { return x.activity_id === sel.id; })[0];
    return where + ' · the ' + (m ? m.type + ' on ' + shortDate(m.on) : 'meeting ' + sel.id);
  }
  if (sel.kind === 'deck') return where + ' · its slides';
  if (sel.kind === 'outcome') return where + ' · ' + sel.id + ' ' + (OUTCOME_TITLE[sel.id] || '');
  return where + ' · ' + sel.id;
}

function Inspector(props) {
  const sel = props.sel;
  // A draft is a record marked `approval: draft`; accepting it is an edit to
  // that record, which this page can name but not make.
  const drafted = isDraft(sel.id);
  const aboutStudents = sel.kind === 'student' || (sel.kind === 'todo' && sel.todo.kind === 'approve');
  // Only the verbs that apply. A disabled "Open — nothing to read here" is a
  // button explaining that it is not a button.
  return h('div', { className: 'inspect' },
    h('div', { className: 'what' },
      h('p', null, h('span', { className: 'k' }, icon('ask'), ' Claude will know: '), sayOf(sel)),
      h('details', null,
        h('summary', null, 'the packet, as sent'),
        h('pre', { className: 'packet mono' }, JSON.stringify(props.packet, null, 1)))),
    h('div', { className: 'verbs' },
      props.onOpen ? h('button', { className: 'ghost', type: 'button', onClick: props.onOpen }, 'Open') : null,
      h('button', { className: 'primary', type: 'button', onClick: props.onAsk }, icon('ask'), 'Ask'),
      h('button', { className: 'x', type: 'button', onClick: props.onClose, 'aria-label': 'Clear' }, '×')),
    drafted
      ? h('div', { className: 'note' }, 'A draft. To accept it, change ', h('code', null, 'approval: draft'),
          ' in its record — this page can point at it, not change it.')
      : aboutStudents
        ? h('div', { className: 'note' }, 'Nothing here settles a judgement about a student: a grade is ' +
            'decided by your professor_decision beside the suggestion.')
        : null);
}

/**
 * Chat, over the course page.
 *
 * Portalled to the body and given the veil `MaterialModal` already uses, so
 * the gesture is one the professor has learnt once: it covers the page, the
 * week they pressed stays visible around its edges, and Escape, the backdrop
 * or the × puts it away. The course is never navigated away from — which is
 * the whole claim course mode makes about the agent, expressed as geometry.
 *
 * The turn opens already knowing what it is about. Nothing here is typed to
 * establish that; the packet in the header is what the press carried.
 */
function ChatOverlay(props) {
  const close = props.onClose;
  const box = useRef(null);
  const [said, setSaid] = useState(function () {
    return [{ me: true, lines: [promptFor(props.sel)] }, { me: false, lines: replyFor(props.sel) }];
  });
  const [typed, setTyped] = useState('');

  useEffect(function () {
    // Capture, and stop it: while this is open Escape belongs to it, not to the
    // selection underneath. Same listener shape as MaterialModal's.
    const onKey = function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    };
    window.addEventListener('keydown', onKey, true);
    const previous = document.activeElement;
    if (box.current) box.current.focus();
    return function () {
      window.removeEventListener('keydown', onKey, true);
      if (previous && previous.focus) previous.focus();
    };
  }, [close]);

  const send = function () {
    const text = typed.trim();
    if (!text) return;
    setSaid(said.concat([
      { me: true, lines: [text] },
      { me: false, lines: ['Noted — this prototype does not reach a model. What a real turn ' +
        'would have here is the answer, with the packet above already in its context.'] },
    ]));
    setTyped('');
  };

  const where = whereOf(props.sel);

  return ReactDOM.createPortal(
    h('div', {
      className: 'veil',
      onMouseDown: function (e) { if (e.target === e.currentTarget) close(); },
    },
      h('div', {
        className: 'modal', role: 'dialog', 'aria-modal': 'true', tabIndex: -1, ref: box,
        'aria-label': 'Chat over ' + where,
        onMouseDown: function (e) { e.stopPropagation(); },
      },
        h('header', null,
          h('b', null, 'Chat'),
          h('span', { className: 'where mono' }, 'over ' + where),
          h('button', { className: 'ghost', type: 'button', onClick: close }, 'Back to the course'),
          h('button', { className: 'x', type: 'button', onClick: close, 'aria-label': 'Close' }, '×')),
        h('div', { className: 'body' },
          h('div', { className: 'ctx mono' },
            h('b', null, 'carried with the turn — nobody typed this'),
            JSON.stringify(props.packet || { run: DATA.run.id, view: 'outline' })),
          said.map(function (turn, i) {
            return h('div', { key: i },
              h('div', { className: 'who' }, turn.me ? 'professor' : 'exoskeleton'),
              h('div', { className: 'said' + (turn.me ? ' me' : '') },
                turn.lines.map(function (p, j) { return h('p', { key: j }, p); })));
          })),
        h('div', { className: 'composer' },
          h('textarea', {
            value: typed, id: 'composer', spellCheck: false,
            placeholder: 'Ask about ' + where + '…', 'aria-label': 'Message',
            onChange: function (e) { setTyped(e.target.value); },
            onKeyDown: function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
            },
          }),
          h('button', { className: 'primary', type: 'button', onClick: send,
                        disabled: !typed.trim() }, 'Send'))
      )),
    document.body);
}

function Explainer(props) {
  if (props.mode === 'chat') {
    return h('div', { className: 'legend' },
      h('h2', null, 'Chat mode, as it exists today'),
      h('p', null, 'The right column is the real ', h('code', null, 'dsh-professor-pane'),
        ' document, served from the same files a chat client is served, with ',
        h('code', null, 'sections.gaps'), ' on. The tabs above it are the pane’s own chrome. ' +
        'Nothing here is a mockup except the conversation.'),
      h('p', null, 'This is the arrangement course mode inverts: the course is a reference ' +
        'beside the conversation rather than the thing being worked on.'));
  }
  // One note, not an essay. The design reasoning that used to sit here is in
  // README.md beside this file, where it is read by the people reviewing the
  // design rather than scrolled past by the professor using the page.
  return h('div', { className: 'legend' },
    h('p', null, h('b', null, 'Prototype. '), 'The weeks, meetings, assessments, evidence, ' +
      'gradebook and inbox are the real CSS-4008 example course. Invented, and marked where they ' +
      'appear: the three student names, the three drafts, and the conversation. The page reaches ' +
      'no model. Design notes: ', h('code', null, 'prototype/README.md'), '.'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
