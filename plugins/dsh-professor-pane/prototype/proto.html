<title>Course Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
:root {
  --ground:#f3f4f0; --surface:#ffffff; --sunk:#eceee8; --ink:#171b18; --muted:#616a62;
  --line:#dadfd6; --rule:#e8ebe4;
  --accent:#2f6b3c; --accent-ink:#245231; --accent-line:#bcd8c2; --accent-tint:#eef5ef;
  --flag:#a4362f; --flag-line:#f0c4c0; --flag-tint:#fdf1f0;
  --draft:#2f5b8a; --draft-line:#bdd0e4; --draft-tint:#eef3f9;
  --hw:#a46a1f;
  --on-fg:#ffffff;
  /* Five sizes, and nothing under 12px. Every font-size below is one of them. */
  --fs-xs:12px; --fs-s:13px; --fs-m:14px; --fs-l:16px; --fs-xl:20px;
  /* The appearance half. A preset sets only these four, the way a template's
     style sheet may set only appearance — see the Appearance picker. */
  --card-pad:12px; --card-gap:8px; --title:14px; --chip:13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#101310; --surface:#191d1a; --sunk:#141815; --ink:#e6eae4; --muted:#96a096;
    --line:#2b312c; --rule:#222722;
    --accent:#7fc98d; --accent-ink:#a6dcaf; --accent-line:#33513a; --accent-tint:#18231a;
    --flag:#e08c85; --flag-line:#6b3a37; --flag-tint:#2a1c1b;
    --draft:#8fb6de; --draft-line:#37506b; --draft-tint:#171f27; --hw:#d9a35b;
    --on-fg:#0d100d;
  }
}
:root[data-theme="dark"] {
  --ground:#101310; --surface:#191d1a; --sunk:#141815; --ink:#e6eae4; --muted:#96a096;
  --line:#2b312c; --rule:#222722;
  --accent:#7fc98d; --accent-ink:#a6dcaf; --accent-line:#33513a; --accent-tint:#18231a;
  --flag:#e08c85; --flag-line:#6b3a37; --flag-tint:#2a1c1b;
  --draft:#8fb6de; --draft-line:#37506b; --draft-tint:#171f27; --hw:#d9a35b;
  --on-fg:#0d100d;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); margin: 0;
       font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
       font-size: var(--fs-m); line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
/* An icon sits on the text's baseline at the text's size and colour, so it
   follows a chip's tone (red on a hole, green on a deck) without its own rule. */
.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor;
     stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.chip .i { opacity: .85; }
.seg button, .primary, .ghost { display: inline-flex; align-items: center; gap: 6px; }
.todo-i { flex: none; color: var(--muted); font-size: var(--fs-l); line-height: 1; padding-top: 1px; }
.todo.high .todo-i, .todo.urgent .todo-i { color: var(--flag); }
.inspect .what p .k .i { color: var(--accent); }
.wkconcepts .concept-i { color: var(--muted); align-self: center; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
          background: var(--surface); border-bottom: 1px solid var(--line);
          display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; }
.brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; min-width: 0; }
.brand b { font-weight: 600; font-size: var(--fs-m); white-space: nowrap; }
.brand span { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 4px 11px;
              font-size: var(--fs-s); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink);
                                   font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* Everything a press reaches, the keyboard reaches, and shows where it is. */
[tabindex="0"]:focus-visible, .chip:focus-visible, .primary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
         padding: 5px 11px; font-size: var(--fs-s); }
.ghost:hover { border-color: var(--accent-line); color: var(--accent-ink); }
.ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink);
                              background: var(--accent-tint); }
.primary { border: 1px solid var(--accent); background: var(--accent); color: var(--on-fg);
           border-radius: 8px; padding: 5px 12px; font-size: var(--fs-s); font-weight: 500; }
.primary[disabled] { opacity: .4; cursor: not-allowed; }

/* The bars' heights are measured, not assumed: the top bar wraps on a narrow
   window, and a hard-coded offset then slides the sticky headers under it. */
.strip { position: sticky; top: calc(var(--top-h, 51px) + env(safe-area-inset-top, 0px)); z-index: 20;
         background: var(--ground); border-bottom: 1px solid var(--rule);
         display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 9px 20px; }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.tally span { font-size: var(--fs-xs); border-radius: 999px; padding: 2px 9px;
              border: 1px dashed var(--flag-line); color: var(--flag); }
.tally span.zero { border-style: solid; border-color: var(--line); color: var(--muted); }
.banner { margin: 14px 20px 0; max-width: 1140px; padding: 9px 13px; border-radius: 9px;
          font-size: var(--fs-s); background: var(--draft-tint); color: var(--muted);
          border: 1px solid var(--draft-line); }
.banner b { color: var(--draft); font-weight: 500; }

.spine { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 10px;
         max-width: 1180px; }

/* The term table. A structure declares the layout its children expect — this
   one puts every week into ONE grid, which is the only way the columns line up
   from week 1 to week 16. The week's heading and its concepts span the full
   row; the three cells sit under the headers. Lecture takes the wide track,
   because it carries the class AND everything the class uses. */
/* A meeting and its own materials, as one block: the deck and the readings are
   the meeting's `resources` in the record, so nesting them is the shape the
   model already has rather than a flattening of it. */
.meeting { display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
           padding-left: 9px; border-left: 2px solid var(--rule); }
.meeting + .meeting { margin-top: 3px; }
.spine.grid3 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.25fr) minmax(0, .75fr);
               gap: 0; max-width: none; margin: 16px 20px 24px; padding: 0;
               background: var(--surface); border: 1px solid var(--line);
               border-radius: 12px;
               /* `clip`, not `hidden`: hidden makes this a scroll container, and
                  the sticky column headers then offset by their `top` INSIDE it
                  — landing below the first week instead of above it. `clip`
                  still clips to the radius and leaves the viewport as the
                  scrollport the headers stick to. */
               overflow: clip; }
.spine.grid3 .th { position: sticky; z-index: 10;
                   top: calc(var(--top-h, 51px) + var(--strip-h, 41px) + env(safe-area-inset-top, 0px));
                   background: var(--sunk); color: var(--muted); padding: 8px 12px;
                   font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase;
                   border-bottom: 1px solid var(--line); }
.wkhead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
          padding: 14px 12px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.wkhead:hover { background: var(--sunk); }
.wkhead b { font-size: var(--fs-l); font-weight: 600; font-variant-numeric: tabular-nums;
            letter-spacing: -.02em; }
.wkhead h3 { margin: 0; font-size: var(--title); font-weight: 600; }
.wkhead h3.none { color: var(--muted); font-weight: 450; }
.wkhead.now { background: var(--accent-tint); }
.wkhead.now b { color: var(--accent); }
.wkhead.sel { box-shadow: inset 3px 0 0 var(--accent); }
.wkconcepts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px;
              padding: 2px 12px 10px; }
.cell { padding: 9px 12px 15px; display: flex; flex-direction: column; gap: 5px;
        align-items: flex-start; border-left: 1px solid var(--rule); font-size: var(--chip);
        min-width: 0; }
.cell > * { max-width: 100%; }
.dash { color: var(--muted); opacity: .5; }
/* A run of weeks with nothing planned in them, drawn once. Five identical
   "Unplanned" rows are a fifth of the page saying one thing. */
.band { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
        padding: 14px 12px; border-top: 1px solid var(--line); background: var(--sunk); }
.spine:not(.grid3) > .band { border: 1px dashed var(--line); border-radius: 12px; }
.band b { font-size: var(--fs-l); font-weight: 600; font-variant-numeric: tabular-nums; }
.band .none { color: var(--muted); }
/* What is on no week, before week 1: the most actionable thing on the page. */
.lead { margin: 16px 20px 0; padding: 12px 14px; border: 1px dashed var(--flag-line);
        border-radius: 12px; background: var(--surface); display: flex; flex-wrap: wrap;
        align-items: center; gap: 8px 10px; }
.lead > b { font-size: var(--fs-m); font-weight: 600; margin-right: 4px; }
/* Columns do not fit a phone. The cells stack and each says which column it
   was, from the name the structure gave it — so the fallback is the template's
   own word rather than one this style sheet invented. */
@media (max-width: 900px) {
  .spine.grid3 { grid-template-columns: 1fr; }
  .spine.grid3 .th { display: none; }
  .cell { border-left: 0; padding: 4px 12px; flex-direction: row; flex-wrap: wrap;
          align-items: baseline; gap: 6px; }
  .cell::before { content: attr(data-col); color: var(--muted); font-size: var(--fs-xs);
                  letter-spacing: .06em; text-transform: uppercase; flex: 0 0 74px; }
  .cell:last-of-type { padding-bottom: 14px; }
}
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      display: grid; grid-template-columns: 58px 1fr; overflow: hidden; cursor: pointer; }
.wk:hover { border-color: var(--accent-line); }
.wk.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wk.now { background: var(--accent-tint); }
.wk.quiet { opacity: .6; }
.wk.stranded { border-style: dashed; cursor: default; }
.wk-n { border-right: 1px solid var(--rule); padding: var(--card-pad) 0; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 2px; }
.wk-n b { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1;
          font-variant-numeric: tabular-nums; }
.wk.now .wk-n b { color: var(--accent); }
.wk-n span { font-size: var(--fs-xs); color: var(--muted); }
.wk-body { padding: var(--card-pad) 14px; min-width: 0; display: flex; flex-direction: column;
           gap: var(--card-gap); }
.wk-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.wk-head h3 { margin: 0; font-size: var(--title); font-weight: 600; }
.wk-head h3.none { color: var(--muted); font-weight: 450; }
.pill { font-size: var(--fs-xs); border-radius: 999px;
        padding: 2px 8px; font-weight: 500; }
.pill.now { background: var(--accent); color: var(--on-fg); }
.pill.draft { background: var(--draft-tint); color: var(--draft); border: 1px solid var(--draft-line); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--chip);
        border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
        padding: 3px 9px; max-width: 100%; text-align: left; }
.chip .k { color: var(--muted); font-size: var(--fs-xs); }
.chip.meet { background: var(--sunk); border-color: transparent; }
.chip.deck { border-color: var(--accent-line); background: var(--accent-tint);
             color: var(--accent-ink); font-weight: 500; }
/* Graded work is a fact about the week, not an alarm: ink on the surface, with
   the weight as the one figure in bold. Red is kept for what is missing, so
   that "Foundations Quiz 15%" and "Draft deck" never read as the same thing. */
.chip.work { border-color: var(--line); color: var(--ink); background: var(--surface); }
.chip .wt { font-weight: 600; font-variant-numeric: tabular-nums; }
/* A hole is a verb. The chip says what pressing it does, and the press opens
   the conversation with the packet already in it. */
.chip.gap { border-style: dashed; border-color: var(--flag-line); color: var(--flag); background: none;
            font-weight: 500; }
button.chip.gap:hover { background: var(--flag-tint); border-style: solid; }
/* Ranked by when it bites. This week and next: filled, because it is the
   Tuesday problem. Weeks already taught: grey, still pressable, because a deck
   for week 1 is next year's work and not today's. */
.chip.gap.soon { background: var(--flag-tint); border-style: solid; font-weight: 600; }
.chip.gap.past { color: var(--muted); border-color: var(--line); font-weight: 450; }
button.chip.gap.past:hover { background: var(--sunk); }
.tally span.soon { border-style: solid; background: var(--flag-tint); font-weight: 600; }
.tally span.past { border-color: var(--line); color: var(--muted); }

/* The one menu: everything that changes how the page is drawn rather than
   what it shows. */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 300px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 12px 14px;
        display: flex; flex-direction: column; gap: 12px; }
.menu label { display: block; font-size: var(--fs-xs); font-weight: 500;
              color: var(--muted); margin-bottom: 5px; }
.menu .hint { display: block; margin-top: 4px; }
.pick { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-s); color: var(--muted); }
.pick select { font: inherit; font-size: var(--fs-s); color: var(--ink); background: var(--surface);
               border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.pick select:focus-visible, .pick input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick input { accent-color: var(--accent); margin: 0; }
.pick.off { opacity: .45; }
.chip.draftc { border-color: var(--draft-line); background: var(--draft-tint); color: var(--draft); }
.chip.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
/* The work's type, in the chip: the word a professor scans the column for. */
.chip .tag { font-size: var(--fs-xs); color: var(--muted); border-right: 1px solid var(--line);
             padding-right: 6px; }
/* An outcome taught here is quiet; one assessed here is the accent, so a run
   of weeks teaching LO-02 and then the week that measures it reads as a shape. */
.chip.lo { background: none; border-color: var(--line); color: var(--ink); font-weight: 500; }
.chip.lo .k { font-weight: 400; }
.chip.lo.hit { background: var(--accent-tint); border-color: var(--accent-line); color: var(--accent-ink); }
.chip.concept { border-color: transparent; background: var(--sunk); color: var(--muted); font-size: var(--fs-xs); }
/* Another format of the deck beside it, the way `.fmt` reads in the pane: a
   small hard label, not a second thing called Slides. */
.chip.fmt { border-color: var(--accent-line); color: var(--accent-ink); font-size: var(--fs-xs);
            letter-spacing: .04em; font-weight: 600; padding: 2px 7px; }
.ev { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--muted); }
.ev b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.ev .none-yet { font-style: italic; }
.bar { height: 5px; border-radius: 3px; background: var(--sunk); width: 76px; overflow: hidden;
       display: inline-block; }
.bar i { display: block; height: 100%; background: var(--accent); }
.ready { font-size: var(--fs-xs); color: var(--accent); }
.none-yet { font-size: var(--fs-xs); color: var(--muted); font-style: italic; }

/* ------------------------------------------------------------- the workshop */
.shop { border-top: 1px solid var(--line); background: var(--surface);
        padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.shop .lineup { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.shop label { font-size: var(--fs-xs); font-weight: 500;
              color: var(--muted); margin-right: 8px; }
.shop textarea { width: 100%; min-height: 190px; resize: vertical; font-size: var(--fs-xs);
                 line-height: 1.55; font-family: "IBM Plex Mono", ui-monospace, monospace;
                 background: var(--sunk); color: var(--ink); border: 1px solid var(--line);
                 border-radius: 10px; padding: 11px 13px; }
.shop textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.err { font-size: var(--fs-xs); color: var(--flag); background: var(--flag-tint);
       border: 1px solid var(--flag-line); border-radius: 8px; padding: 8px 11px; }
.ok { font-size: var(--fs-xs); color: var(--muted); }

/* Lectures, Assessment, Quiz, Students and Todos: lists rather than a spine,
   because each reads down a different axis from the week. */
.listing { margin: 16px 20px 24px; }
.listing .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;
                   background: var(--surface); }
.listing table { width: 100%; border-collapse: collapse; background: var(--surface);
                 font-size: var(--fs-s); }
/* The student column stays put while the assessments scroll past it. Without
   it a row of twenty-one marks is a row of numbers belonging to nobody. */
.listing tbody td:first-child, .listing thead th:first-child {
  position: sticky; left: 0; z-index: 1; background: var(--surface); }
.listing thead th:first-child { background: var(--sunk); }
.listing tbody tr:hover td:first-child { background: var(--sunk); }
.listing th { text-align: left; background: var(--sunk); color: var(--muted);
              font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase;
              font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--line);
              vertical-align: bottom; }
.listing th small { display: block; font-size: var(--fs-xs); letter-spacing: 0; text-transform: none;
                    color: var(--muted); font-weight: 400; max-width: 11ch; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
.listing td { padding: 9px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
.listing tbody tr { cursor: pointer; }
.listing tbody tr:hover { background: var(--sunk); }
.listing td small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.listing .num { text-align: right; font-variant-numeric: tabular-nums; }
.listing .foot { color: var(--muted); font-size: var(--fs-xs); margin: 12px 2px 0; max-width: 80ch; }
/* A mark, scannable along the row: the glyph is the state, the text the
   amount. Colour follows the glyph, never replaces it. */
.mark { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap;
        font-variant-numeric: tabular-nums; cursor: help; }
.mark .g { font-size: var(--fs-m); line-height: 1; }
.mark.ok { color: var(--accent-ink); font-weight: 600; }
.mark.part { color: var(--ink); }
.mark.miss { color: var(--flag); font-weight: 500; }
.mark.wait { color: var(--muted); }
.warn { color: var(--flag); font-weight: 600; }
.chip.sig { border-color: var(--flag-line); color: var(--flag); background: var(--flag-tint); }
.listing .foot.key { display: flex; flex-wrap: wrap; gap: 6px 16px; max-width: none; }
.listing .foot.key .mark { cursor: default; }
.listing .blocked p { color: var(--muted); font-size: var(--fs-xs); margin: 6px 2px 0;
                      max-width: 90ch; border-left: 2px solid var(--flag-line);
                      padding-left: 10px; }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }
/* Names are showing. Amber, full width, and above the table rather than beside
   it — the point is that it is impossible to have missed. */
.rule { margin: 0; padding: 9px 20px; font-size: var(--fs-xs); color: var(--flag);
        background: var(--flag-tint); border-bottom: 1px solid var(--flag-line);
        border-top: 1px solid var(--flag-line); }
.rule b { font-weight: 600; }
.banner.student { background: var(--accent-tint); border-color: var(--accent-line); }
.banner.student b { color: var(--accent-ink); }
.seg.sub { background: none; padding: 0; gap: 0; }
.seg.sub button { border: 1px solid transparent; }
.seg.sub button[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink);
                                       border-color: var(--accent-line); box-shadow: none; }

.todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;
         gap: 6px; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 11px 13px; cursor: pointer;
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.todo:hover { border-color: var(--accent-line); }
.todo .body { flex: 1; min-width: 0; }
.todo .body b { display: block; font-size: var(--fs-m); font-weight: 500; }
.todo .body small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.todo .when { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
/* Severity is form as well as colour: the rail is what you scan, the word is
   what you read when you have stopped. */
.pri { flex: none; font-size: var(--fs-xs); text-transform: capitalize;
       border-radius: 4px; padding: 2px 7px; font-weight: 600; }
.pri.high, .pri.urgent { background: var(--flag-tint); color: var(--flag);
                         border: 1px solid var(--flag-line); }
.pri.medium { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.pri.low { background: none; color: var(--muted); border: 1px solid var(--line); }
.todo.high, .todo.urgent { box-shadow: inset 3px 0 0 var(--flag); }

.inspect { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface);
           border-top: 1px solid var(--line);
           padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
           display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.inspect .what { min-width: 0; flex: 1 1 320px; }
.inspect .what p { margin: 0; font-size: var(--fs-m); }
.inspect .what p .k { color: var(--muted); }
.inspect details { margin-top: 6px; }
.inspect summary { font-size: var(--fs-xs); color: var(--muted); cursor: pointer; }
.inspect details .packet { margin-top: 6px; }
.inspect .note { flex-basis: 100%; font-size: var(--fs-xs); color: var(--muted); }
/* What the fixed bar covers, given back at the foot of the page — its real
   height rather than a guess reserved whether or not anything is selected. */
.inspect-room { height: var(--inspect-h, 0px); }
.packet { font-size: var(--fs-xs); background: var(--sunk); border-radius: 8px; padding: 9px 11px;
          overflow-x: auto; white-space: pre; margin: 0; }
.verbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.chatmode { display: flex; align-items: stretch; min-height: 70vh; }
.convo { flex: 1 1 auto; min-width: 0; padding: 26px 20px 60px; display: flex;
         flex-direction: column; gap: 18px; }
.convo .turn { max-width: 640px; }
.who { font-size: var(--fs-xs); color: var(--muted); text-transform: capitalize; font-weight: 500;
       margin-bottom: 5px; }
.said { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        padding: 12px 14px; font-size: var(--fs-m); }
.said.me { background: var(--sunk); border-color: transparent; }
.said p { margin: 0 0 9px; } .said p:last-child { margin: 0; }
.pane { flex: 0 0 300px; border-left: 1px solid var(--line); background: var(--surface);
        display: flex; flex-direction: column; }
.pane-tabs { display: flex; gap: 2px; padding: 8px 8px 0; flex-wrap: wrap; }
.pane-tabs button { border: 0; background: none; font-size: var(--fs-xs); padding: 4px 7px;
                    border-radius: 6px; color: var(--muted); }
.pane-tabs button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); font-weight: 500; }
.pane-sub { display: flex; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--rule);
            font-size: var(--fs-xs); color: var(--muted); flex-wrap: wrap; }
.pane-sub b { color: var(--ink); font-weight: 500; }
.pane iframe { border: 0; width: 100%; flex: 1 1 auto; min-height: 620px; }
@media (max-width: 760px) {
  .chatmode { flex-direction: column; }
  .pane { flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line); }
}

/* Chat opens OVER the course, and borrows the geometry MaterialModal already
   uses to open a deck over the harness: a veil inset from the edges so the week
   you pressed stays visible around it, Escape, the backdrop, or the ×. The page
   is not replaced and not navigated away from — the conversation is a thing you
   open on top of what you were looking at, and close again. */
.veil { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column;
        padding: 24px clamp(16px, 4vw, 64px) 28px;
        padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        background: rgba(12, 16, 13, .52); }
.modal { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
         border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
         box-shadow: 0 18px 60px rgba(0,0,0,.35); }
.modal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.modal > header { flex: none; display: flex; align-items: center; gap: 10px;
                  padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--rule); }
.modal > header b { font-size: var(--fs-s); font-weight: 600; }
.modal > header .where { font-size: var(--fs-xs); color: var(--muted); margin-right: auto;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal .body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 18px;
               display: flex; flex-direction: column; gap: 14px; }
.modal .body > * { width: 100%; max-width: 660px; margin-inline: auto; }
.composer { flex: none; border-top: 1px solid var(--rule); padding: 12px;
            display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 40px; max-height: 140px; resize: vertical;
                     font: inherit; font-size: var(--fs-m); padding: 9px 11px; color: var(--ink);
                     background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; }
.composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* A material fills the panel the way the deck does in the harness. */
.matframe { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
.matnote { padding: 26px 24px; max-width: 70ch; }
.matnote b { display: block; font-size: var(--fs-m); margin-bottom: 8px; }
.matnote p { margin: 0; color: var(--muted); font-size: var(--fs-s); }
.ctx { border: 1px dashed var(--accent-line); border-radius: 9px; padding: 9px 11px;
       background: var(--accent-tint); font-size: var(--fs-xs); color: var(--accent-ink);
       overflow-x: auto; }
.ctx b { display: block; font-size: var(--fs-xs);
         margin-bottom: 5px; color: var(--accent); }
.x { border: 0; background: none; font-size: var(--fs-xl); line-height: 1; color: var(--muted);
     padding: 2px 6px; border-radius: 6px; }
.x:hover { background: var(--sunk); color: var(--ink); }

/* ------------------------------------------------- planning and teaching */
.mode { margin: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 1180px; }
.mode .listing { margin: 0; }
button.link { border: 0; background: none; padding: 0; color: var(--accent-ink); text-align: left;

.calm { margin: 0; color: var(--muted); font-size: var(--fs-s); display: flex; gap: 6px; align-items: center; }
/* The weights against a whole: the first thing checked when building a course. */
.weights { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px;

.lseg { border-left-color: var(--lane); background: color-mix(in srgb, var(--lane) 12%, var(--surface)); color: var(--ink); }
.lanehead { border-bottom-color: var(--lane); }

.trio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px;
        align-items: start; }
@media (max-width: 900px) { .trio { grid-template-columns: 1fr; } .trio .focus { order: -1; } }
.side, .focus { border-radius: 12px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
.side { background: var(--sunk); }

.side > b { font-size: var(--fs-m); }

.focus h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;
         font-size: var(--fs-s); }
.facts li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.revisit p { margin: 2px 0 0; }
.focus .primary { align-self: flex-start; }

.legend { max-width: 1180px; padding: 4px 20px 26px; }
.legend h2 { font-size: var(--fs-l); margin: 20px 0 6px; font-weight: 600; }

// ---------------------------------------------------------------------------
// The template language, as shipped.
//
// `esc` first, then vendor/ainar/mcp/widget-assets/template.js verbatim — the
// same two things every widget document concatenates, and the same way
// test/widgets.test.ts loads the interpreter. Escaped `{{ paths }}`, `{% if %}`,
// `{% for %}`, and no way to ask for raw output: `{{{` is a parse error. A
// structure a professor edits therefore cannot introduce markup, and cannot
// compute a figure no command produced.
// ---------------------------------------------------------------------------
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

  table: {

      '  <b>{{ w.label }}</b><span class="k mono">{{ w.dates }}</span>',
      '  {% if w.title %}<h3>{{ w.title }}</h3>{% else %}<h3 class="none">Unplanned</h3>{% endif %}',
      '  {% if w.is_now %}<span class="pill now">this week</span>{% endif %}',

      '  {% for g in w.gaps_other %}<button class="chip gap {{ g.tier }}" data-pick="gap" data-id="{{ g.kind }}" title="{{ g.note }}"><svg class="i" aria-hidden="true"><use href="#i-{{ g.icon }}"/></svg>{{ g.label }}</button>{% endfor %}',

      '    <button class="chip meet" data-pick="meeting" data-id="{{ m.id }}"><span class="k mono">{{ m.on }}</span><svg class="i" aria-hidden="true"><use href="#i-{{ m.icon }}"/></svg>{{ m.label }}</button>',

      '    {% for r in m.materials %}<button class="chip {{ r.tone }}" data-pick="{{ r.pick }}" data-id="{{ r.id }}" data-doc="{{ r.doc }}" title="{% if r.kind %}{{ r.kind }} — {% endif %}open it over the course">{% if r.icon %}<svg class="i" aria-hidden="true"><use href="#i-{{ r.icon }}"/></svg>{% endif %}{{ r.label }}</button>{% endfor %}',
      '  </div>{% endfor %}',

      '<div class="cell" data-col="Outcomes" data-week="{{ w.week }}">{% for o in w.outcomes %}<button class="chip lo {{ o.tone }}" data-pick="outcome" data-id="{{ o.id }}" title="{{ o.title }} — {{ o.how }}"><svg class="i" aria-hidden="true"><use href="#i-outcome"/></svg>{{ o.id }}<span class="k">{{ o.how }}</span></button>{% endfor %}{% if w.no_outcomes %}<span class="dash">—</span>{% endif %}</div>',
    ].join('\n'),
  },
  spine: {
    name: 'Spine',
    suits: 'the default — everything a week holds, in the order a week is read',
    tmpl: [
      '<div class="wk {{ w.classes }}" data-pick="week" data-id="{{ w.week }}" data-week="{{ w.week }}" role="button" tabindex="0" aria-label="Week {{ w.week }}{% if w.title %}: {{ w.title }}{% endif %}">',
      '  <div class="wk-n"><b>{{ w.label }}</b><span>{{ w.mark }}</span></div>',
      '  <div class="wk-body">',
      '    <div class="wk-head">',
